<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="API Key密钥调用凭证与账号登录密码两套独立身份体系示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1c"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="keyA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#c98a2b"/>
    </linearGradient>
    <linearGradient id="keyB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd8c9"/>
      <stop offset="1" stop-color="#2f9e8a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.08">
    <circle cx="90" cy="80" r="120" fill="#ffffff"/>
    <circle cx="720" cy="340" r="150" fill="#ffffff"/>
  </g>

  <!-- Left panel: login password -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="280" height="260" rx="18" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="140" y="34" text-anchor="middle" fill="#e8f3ee" font-size="18" font-family="Arial, sans-serif" font-weight="700">登录账号密码</text>
    <g transform="translate(90,60)">
      <rect x="0" y="30" width="100" height="70" rx="10" fill="#2a4636" stroke="url(#keyB)" stroke-width="3"/>
      <path d="M 20 30 L 20 12 A 30 30 0 0 1 80 12 L 80 30" fill="none" stroke="url(#keyB)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="9" fill="#0f2a1c" stroke="url(#keyB)" stroke-width="3"/>
      <rect x="46" y="68" width="8" height="18" rx="3" fill="url(#keyB)"/>
    </g>
    <text x="140" y="200" text-anchor="middle" fill="#c9ddd2" font-size="13" font-family="Arial, sans-serif">控制谁能登录控制台</text>
    <text x="140" y="222" text-anchor="middle" fill="#c9ddd2" font-size="13" font-family="Arial, sans-serif">改设置 · 看账单</text>
  </g>

  <!-- Right panel: API key -->
  <g transform="translate(450,70)">
    <rect x="0" y="0" width="280" height="260" rx="18" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="140" y="34" text-anchor="middle" fill="#e8f3ee" font-size="18" font-family="Arial, sans-serif" font-weight="700">API Key 调用密钥</text>
    <g transform="translate(65,70)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="url(#keyA)" stroke-width="9"/>
      <circle cx="30" cy="30" r="10" fill="#0f2a1c"/>
      <rect x="52" y="22" width="90" height="16" rx="4" fill="url(#keyA)"/>
      <rect x="118" y="38" width="14" height="14" fill="url(#keyA)"/>
      <rect x="96" y="38" width="10" height="18" fill="url(#keyA)"/>
    </g>
    <text x="140" y="200" text-anchor="middle" fill="#c9ddd2" font-size="13" font-family="Arial, sans-serif">控制谁能拿字符串</text>
    <text x="140" y="222" text-anchor="middle" fill="#c9ddd2" font-size="13" font-family="Arial, sans-serif">调用付费接口</text>
  </g>

  <!-- Divider showing they are unrelated -->
  <g transform="translate(400,200)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ff8a8a" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff8a8a" stroke-width="4" stroke-linecap="round" transform="rotate(45)"/>
    <text x="0" y="55" text-anchor="middle" fill="#ffb4b4" font-size="14" font-family="Arial, sans-serif" font-weight="700">两套体系互不关联</text>
  </g>

  <!-- Alert badge on the key side -->
  <g transform="translate(660,90)">
    <circle cx="0" cy="0" r="22" fill="#c0392b"/>
    <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="700">!</text>
  </g>
  <text x="400" y="368" text-anchor="middle" fill="#9db8ab" font-size="14" font-family="Arial, sans-serif">Key 泄露即被盗刷 · 登录记录依旧干净</text>
</svg>
