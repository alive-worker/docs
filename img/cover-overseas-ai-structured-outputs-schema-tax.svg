<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d17"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="ringCold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ringWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="segSchema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="segSyntax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="segData" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="210" cy="220" r="155" fill="#f59e0b" opacity="0.05"/>
  <circle cx="620" cy="180" r="160" fill="#10b981" opacity="0.05"/>

  <!-- Header -->
  <rect x="40" y="26" width="152" height="24" rx="12" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(52, 211, 153, 0.35)"/>
  <text x="116" y="42" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700" text-anchor="middle">STRUCTURED OUTPUTS</text>
  <text x="206" y="43" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12.5">JSON Schema 受限解码冷启动与隐性 Token 税拆解</text>

  <text x="40" y="80" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="800">语法编译环 + 隐式注入账单：结构化输出的两笔隐藏成本</text>

  <!-- Left: Circular FSM Compiler Ring -->
  <circle cx="205" cy="232" r="102" fill="none" stroke="rgba(148,163,184,0.14)" stroke-width="14"/>
  <circle cx="205" cy="232" r="102" fill="none" stroke="url(#ringCold)" stroke-width="14" stroke-dasharray="430 220" stroke-linecap="round" transform="rotate(-110 205 232)"/>
  <circle cx="205" cy="232" r="76" fill="none" stroke="rgba(52,211,153,0.22)" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="205" cy="232" r="64" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

  <text x="205" y="218" fill="#fbbf24" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FSM 语法编译</text>
  <text x="205" y="244" fill="#f8fafc" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" text-anchor="middle">+2~15s</text>
  <text x="205" y="264" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">动态枚举即击穿缓存</text>

  <!-- Orbiting state nodes -->
  <circle cx="205" cy="130" r="9" fill="#f59e0b"/>
  <text x="205" y="114" fill="#fde68a" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Schema 变更</text>

  <circle cx="307" cy="232" r="9" fill="#ef4444"/>
  <text x="324" y="229" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">重建状态机</text>
  <text x="324" y="244" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10">首字延迟飙升</text>

  <circle cx="118" cy="285" r="8" fill="#10b981"/>
  <text x="98" y="308" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" text-anchor="middle">固定结构命中缓存</text>

  <!-- Divider -->
  <line x1="418" y1="112" x2="418" y2="352" stroke="rgba(148,163,184,0.16)" stroke-dasharray="4 4"/>

  <!-- Right: Vertical Stacked Token Anatomy Column -->
  <text x="450" y="122" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="13.5" font-weight="700">单次调用的真实 Token 构成</text>

  <!-- Single tall stacked bar -->
  <rect x="454" y="138" width="54" height="214" rx="10" fill="#131c2e" stroke="rgba(255,255,255,0.09)"/>
  <!-- Segment 1: Schema Injection (42%) -->
  <rect x="458" y="142" width="46" height="86" rx="6" fill="url(#segSchema)"/>
  <text x="481" y="190" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="12" font-weight="800" text-anchor="middle">42%</text>
  <!-- Segment 2: JSON Syntax & Keys (28%) -->
  <rect x="458" y="232" width="46" height="56" rx="6" fill="url(#segSyntax)"/>
  <text x="481" y="264" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="12" font-weight="800" text-anchor="middle">28%</text>
  <!-- Segment 3: Prompt + Payload (30%) -->
  <rect x="458" y="292" width="46" height="56" rx="6" fill="url(#segData)"/>
  <text x="481" y="324" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="12" font-weight="800" text-anchor="middle">30%</text>

  <!-- Callout lines & labels -->
  <line x1="510" y1="185" x2="542" y2="185" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="542" cy="185" r="3" fill="#f59e0b"/>
  <text x="554" y="179" fill="#fbbf24" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="700">隐式 Schema 注入输入</text>
  <text x="554" y="197" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">字段描述与枚举按输入 Token 全量计费</text>

  <line x1="510" y1="260" x2="542" y2="260" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="542" cy="260" r="3" fill="#ef4444"/>
  <text x="554" y="254" fill="#f87171" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="700">JSON 键名与转义符号膨胀</text>
  <text x="554" y="272" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">长键名、引号和重复结构拉高输出费用</text>

  <line x1="510" y1="320" x2="542" y2="320" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="542" cy="320" r="3" fill="#10b981"/>
  <text x="554" y="314" fill="#34d399" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="700">有效业务提示词与结论值</text>
  <text x="554" y="332" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">真正产生业务价值的净 Token 占比偏低</text>

  <!-- Footer -->
  <text x="40" y="382" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">ponr.org · 固定 Schema 结构 + 外置动态枚举 + 精简短键名，可同时消除冷启动与隐性 Token 溢价</text>
</svg>
