<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- left panel: SSO / HR system, account disabled -->
  <rect x="60" y="90" width="280" height="220" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#8fd3c8" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" fill="#e8f6f1" font-family="Arial, sans-serif" font-size="20" font-weight="700">SSO 账号</text>
  <circle cx="200" cy="200" r="42" fill="none" stroke="#4ade80" stroke-width="6"/>
  <path d="M180 200 l14 14 l28 -32" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="270" text-anchor="middle" fill="#bfe9d8" font-family="Arial, sans-serif" font-size="18">已禁用</text>

  <!-- middle: delayed sync clock -->
  <g stroke="#f2c94c" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M340 175 l40 -15"/>
    <path d="M420 240 l40 15"/>
  </g>
  <circle cx="400" cy="200" r="22" fill="none" stroke="#f2c94c" stroke-width="5"/>
  <path d="M400 188 l0 14 l10 6" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="150" text-anchor="middle" fill="#f2c94c" font-family="Arial, sans-serif" font-size="16" font-weight="700">SCIM 同步延迟</text>

  <!-- right panel: AI tool, session still active -->
  <rect x="460" y="90" width="280" height="220" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#7fb2ff" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" fill="#e8f0ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">ChatGPT / Claude</text>
  <circle cx="600" cy="200" r="42" fill="none" stroke="#ff6b6b" stroke-width="6"/>
  <circle cx="600" cy="200" r="16" fill="#ff6b6b"/>
  <text x="600" y="270" text-anchor="middle" fill="#ffd8d8" font-family="Arial, sans-serif" font-size="18">会话仍活跃</text>

  <text x="400" y="360" text-anchor="middle" fill="#dbe7ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">SSO 禁用 ≠ AI 工具访问权限已立即收回</text>
</svg>
