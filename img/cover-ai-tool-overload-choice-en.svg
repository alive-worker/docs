  <g stroke="#63d9c4" stroke-opacity="0.32" stroke-width="1.4">
    <line x1="400" y1="200" x2="180" y2="96"/>
    <line x1="400" y1="200" x2="150" y2="220"/>
    <line x1="400" y1="200" x2="210" y2="320"/>
    <line x1="400" y1="200" x2="620" y2="104"/>
    <line x1="400" y1="200" x2="660" y2="210"/>
    <line x1="400" y1="200" x2="600" y2="318"/>
    <line x1="400" y1="200" x2="360" y2="70"/>
    <line x1="400" y1="200" x2="440" y2="336"/>
    <line x1="180" y1="96" x2="360" y2="70"/>
    <line x1="620" y1="104" x2="360" y2="70"/>
    <line x1="150" y1="220" x2="210" y2="320"/>
    <line x1="660" y1="210" x2="600" y2="318"/>
