  <text x="400" y="209" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" font-weight="700" fill="#eafff9" text-anchor="middle">AI</text>
  <text x="56" y="360" font-family="'Segoe UI',system-ui,sans-serif" font-size="28" font-weight="700" fill="#eafff9">Too many AI tools, too little choice</text>
