<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Are we losing the ability to choose as AI tools multiply cover image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b3d"/>
      <stop offset="1" stop-color="#1f5f5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5fe3c7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fe3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0d8"/>
      <stop offset="1" stop-color="#39b8a5"/>
