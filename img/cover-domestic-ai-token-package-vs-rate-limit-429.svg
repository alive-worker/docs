<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#142820"/>
  
  <!-- Left: Token Reservoir / Cylinder -->
  <g transform="translate(60, 110)">
    <!-- Tank Body -->
    <rect x="0" y="30" width="130" height="170" rx="10" fill="#1b382c" stroke="#3d6c56" stroke-width="2"/>
    <!-- Liquid fill (Full) -->
    <rect x="6" y="70" width="118" height="124" rx="6" fill="#2d5e46"/>
    <ellipse cx="65" cy="30" rx="65" ry="18" fill="#244a3a" stroke="#3d6c56" stroke-width="2"/>
    <ellipse cx="65" cy="70" rx="59" ry="14" fill="#3e7a5c"/>
    <text x="65" y="115" fill="#f4f1e8" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">5000万 Token</text>
    <text x="65" y="145" fill="#88b99f" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">资源包 充足 (98%)</text>
    <text x="65" y="172" fill="#d7c4a3" font-family="Microsoft YaHei, sans-serif" font-size="11" text-anchor="middle">仅抵扣资金</text>
  </g>

  <!-- Middle: Pipeline with Closed Barrier -->
  <path d="M 190 200 L 330 200" stroke="#3d6c56" stroke-width="14" stroke-linecap="round"/>
  <path d="M 190 200 L 330 200" stroke="#88b99f" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Barrier Gate 429 -->
  <g transform="translate(340, 120)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#2b1a1c" stroke="#e05a47" stroke-width="2.5"/>
    <line x1="10" y1="10" x2="110" y2="150" stroke="#e05a47" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="110" y1="10" x2="10" y2="150" stroke="#e05a47" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="15" y="55" width="90" height="50" rx="6" fill="#b83226"/>
    <text x="60" y="90" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">429</text>
    <text x="60" y="135" fill="#f09890" font-family="Microsoft YaHei, sans-serif" font-size="12" text-anchor="middle">Rate Limit</text>
    <text x="60" y="35" fill="#f4f1e8" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">并发闸门</text>
  </g>

  <!-- Right: Concurrency Gauge Meter -->
  <g transform="translate(530, 100)">
    <circle cx="100" cy="100" r="90" fill="#1b382c" stroke="#3d6c56" stroke-width="2"/>
    <!-- Gauge Arc Background -->
    <path d="M 35 140 A 75 75 0 1 1 165 140" fill="none" stroke="#244a3a" stroke-width="14" stroke-linecap="round"/>
    <!-- Red Overload Arc -->
    <path d="M 125 45 A 75 75 0 0 1 165 140" fill="none" stroke="#e05a47" stroke-width="14" stroke-linecap="round"/>
    <!-- Needle pointing to Red -->
    <line x1="100" y1="100" x2="150" y2="60" stroke="#e0a04a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="8" fill="#e0a04a"/>
    <text x="100" y="130" fill="#d7c4a3" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">TPM / QPS</text>
    <text x="100" y="152" fill="#e05a47" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">共享池打满</text>
  </g>

  <!-- Bottom Notice -->
  <text x="70" y="340" fill="#d7c4a3" font-family="Microsoft YaHei, sans-serif" font-size="15">预付资源包只管余额扣减，调度限流看独立并发池与预留规格</text>
  <!-- Top Banner -->
  <text x="60" y="55" fill="#f4f1e8" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold">Token 预付费 vs 算力并发限制</text>
</svg>
