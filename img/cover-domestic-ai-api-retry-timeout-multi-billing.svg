<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <circle cx="720" cy="80" r="130" fill="#f97316" opacity="0.05"/>
  <circle cx="80" cy="340" r="140" fill="#10b981" opacity="0.04"/>

  <!-- Top Badges -->
  <rect x="40" y="28" width="126" height="26" rx="13" fill="rgba(249, 115, 22, 0.16)"/>
  <text x="103" y="45" fill="#fb923c" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">RETRY STORM</text>
  <text x="180" y="46" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="13">超时重试与算力重叠计费瀑布图</text>

  <!-- Main Headline -->
  <text x="40" y="82" fill="#f1f5f9" font-family="-apple-system,sans-serif" font-size="19" font-weight="800">单次提问因偶发超时触发 3 次重发，产生 300% 账单支出</text>

  <!-- Main Waterfall Canvas Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="720" height="236" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
  </g>

  <!-- Timeline Axis -->
  <line x1="180" y1="125" x2="730" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="180" y="120" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10.5">0s (请求发起)</text>
  <text x="360" y="120" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10.5">10s (超时阈值)</text>
  <text x="540" y="120" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10.5">20s (重试#1超时)</text>
  <text x="700" y="120" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10.5">32s (返回)</text>

  <!-- Vertical Grid Lines -->
  <line x1="360" y1="125" x2="360" y2="310" stroke="rgba(239, 68, 68, 0.25)" stroke-dasharray="3 3"/>
  <line x1="540" y1="125" x2="540" y2="310" stroke="rgba(239, 68, 68, 0.25)" stroke-dasharray="3 3"/>

  <!-- Row 1: Original Request -->
  <text x="60" y="160" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">首次调用 #1</text>
  <text x="60" y="176" fill="#f87171" font-family="-apple-system,sans-serif" font-size="11">10s 客户端断开</text>
  <!-- Bar 1 -->
  <rect x="180" y="146" width="180" height="30" rx="6" fill="url(#bar1Grad)"/>
  <!-- Ghost continuation -->
  <rect x="360" y="146" width="80" height="30" rx="6" fill="rgba(220, 38, 38, 0.45)" stroke="#ef4444" stroke-dasharray="3 2"/>
  <text x="270" y="166" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle">客户端等待中 (10s)</text>
  <text x="400" y="166" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">GPU算至14s</text>
  <text x="460" y="166" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">全额结算 1x</text>

  <!-- Row 2: Retry 1 -->
  <text x="60" y="218" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">超时重试 #2</text>
  <text x="60" y="234" fill="#f87171" font-family="-apple-system,sans-serif" font-size="11">20s 再次超时断开</text>
  <!-- Bar 2 -->
  <rect x="360" y="204" width="180" height="30" rx="6" fill="url(#bar2Grad)"/>
  <rect x="540" y="204" width="70" height="30" rx="6" fill="rgba(220, 38, 38, 0.45)" stroke="#ef4444" stroke-dasharray="3 2"/>
  <text x="450" y="224" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle">二次重试等待 (10s)</text>
  <text x="575" y="224" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">算至24s</text>
  <text x="630" y="224" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">全额结算 1x</text>

  <!-- Row 3: Retry 2 (Success) -->
  <text x="60" y="278" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">最终重试 #3</text>
  <text x="60" y="294" fill="#34d399" font-family="-apple-system,sans-serif" font-size="11">32s 成功吐字</text>
  <!-- Bar 3 -->
  <rect x="540" y="262" width="160" height="30" rx="6" fill="url(#bar3Grad)"/>
  <text x="620" y="282" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle">耗时12s成功返回</text>
  <text x="712" y="282" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">结算 1x</text>

  <!-- Bottom Result Banner inside Card -->
  <rect x="40" y="356" width="720" height="26" rx="6" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)"/>
  <text x="400" y="373" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">账单现实：用户只收到 1 份回答，云端却并发执行了 3 遍完整模型解码，支付了 300% 算力费用</text>
</svg>