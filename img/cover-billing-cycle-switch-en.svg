<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Switching between monthly and annual billing cycles">
  <defs>
    <linearGradient id="bgBcse" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1533"/>
      <stop offset="1" stop-color="#2c1c4d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgBcse)"/>
  <polygon points="0,0 460,0 340,400 0,400" fill="#241a3f"/>
  <polygon points="800,0 460,0 340,400 800,400" fill="#2c1c4d"/>
  <line x1="460" y1="0" x2="340" y2="400" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>

  <g transform="translate(70,80)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#e9d5ff">Monthly</text>
    <g transform="translate(0,26)">
      <rect width="150" height="120" rx="10" fill="#1a1230" stroke="#7c3aed" stroke-width="2"/>
      <line x1="0" y1="28" x2="150" y2="28" stroke="#7c3aed" stroke-width="1.5"/>
      <g fill="#c4b5fd" opacity="0.75">
        <circle cx="24" cy="52" r="4"/><circle cx="54" cy="52" r="4"/><circle cx="84" cy="52" r="4"/><circle cx="114" cy="52" r="4"/>
        <circle cx="24" cy="78" r="4"/><circle cx="54" cy="78" r="4"/><circle cx="84" cy="78" r="4"/><circle cx="114" cy="78" r="4"/>
        <circle cx="24" cy="104" r="4" fill="#a78bfa"/><circle cx="54" cy="104" r="4"/>
      </g>
      <text x="75" y="18" text-anchor="middle" font-size="10.5" fill="#c4b5fd">Billed monthly</text>
    </g>
    <text x="0" y="172" font-size="12" fill="#a78bfa" opacity="0.9">Flexible, higher unit cost</text>
  </g>

  <g transform="translate(560,80)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#e9d5ff">Annual</text>
    <g transform="translate(0,26)">
      <rect width="150" height="120" rx="10" fill="#1a1230" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="0" y1="28" x2="150" y2="28" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M75 46 l8 16 l18 2 l-13 13 l3 18 l-16 -9 l-16 9 l3 -18 l-13 -13 l18 -2 z" fill="#c4b5fd"/>
      <text x="75" y="18" text-anchor="middle" font-size="10.5" fill="#c4b5fd">Locked-in rate</text>
    </g>
    <text x="0" y="172" font-size="12" fill="#c4b5fd" opacity="0.9">Cheaper, ties up cash longer</text>
  </g>

  <g transform="translate(400,220)">
    <rect x="-60" y="-24" width="120" height="48" rx="24" fill="#3b2a63" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="24" cy="0" r="18" fill="#e9d5ff"/>
    <path d="M-60 0 h-40" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrBcse)" opacity="0.7"/>
    <path d="M60 0 h40" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrBcse2)" opacity="0.9"/>
  </g>
  <defs>
    <marker id="arrBcse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 Z" fill="#7c3aed"/></marker>
    <marker id="arrBcse2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a78bfa"/></marker>
  </defs>

  <text x="400" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#f5f3ff">Switching Billing Cycles: What Happens?</text>
  <text x="400" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#c4b5fd" opacity="0.9">Proration · leftover days · switch timing</text>
</svg>
