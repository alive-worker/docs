<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI工具值不值得付费评估框架封面图">
  <defs>
    <linearGradient id="bgEval" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0d3830"/>
    </linearGradient>
    <pattern id="hatchEval" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#134e42" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bgEval)"/>
  <rect width="800" height="400" fill="url(#hatchEval)"/>

  <text x="400" y="52" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#ecfdf5">这个AI工具，到底值不值得付费？</text>
  <text x="400" y="78" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5eead4" opacity="0.9">一套可复用的订阅评估框架</text>

  <!-- centered scorecard checklist -->
  <g transform="translate(220,104)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="360" height="238" rx="14" fill="#0d3830" stroke="#14b8a6" stroke-width="2"/>
    <g transform="translate(24,32)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="15" fill="#ecfdf5">使用频率是否够高</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="66" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <g transform="translate(24,74)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="15" fill="#ecfdf5">能否替代人工时间</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="52" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <g transform="translate(24,116)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#5eead4" stroke-width="2.5" opacity="0.6"/>
      <text x="30" y="5" font-size="15" fill="#ecfdf5" opacity="0.85">是否有免费替代品</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="30" height="16" rx="8" fill="#5eead4" opacity="0.7"/>
    </g>
    <g transform="translate(24,158)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="15" fill="#ecfdf5">续费成本是否透明</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="58" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <line x1="24" y1="188" x2="336" y2="188" stroke="#134e42" stroke-width="1.5"/>
    <text x="24" y="216" font-size="14" fill="#5eead4" font-weight="700">综合评分</text>
    <text x="336" y="216" text-anchor="end" font-size="20" fill="#2dd4bf" font-weight="700">8.5 / 10</text>
  </g>
  <text x="400" y="378" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5eead4" opacity="0.85">四个维度，帮你理性做订阅决策</text>
</svg>
