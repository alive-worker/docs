<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 工具评估框架：嵌入成本、选择过载与三个月留存复盘封面图">
  <defs>
    <linearGradient id="bgGradAtef" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0e3a34"/>
    </linearGradient>
    <radialGradient id="glowAtef" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradAtef)"/>
  <rect width="800" height="400" fill="url(#glowAtef)"/>
  <g stroke="#1e5b50" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5eead4" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">选工具别只看</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">参数表</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">嵌入成本 · 选择过载 · 三个月留存复盘</text>

  <!-- circular retention gauge -->
  <g transform="translate(610,190)">
    <circle r="90" fill="#0f2c26" stroke="#1e5b50" stroke-width="2"/>
    <path d="M0 -90 A90 90 0 1 1 -63.6 63.6" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#ecfdf5">90</text>
    <text x="0" y="34" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5eead4">天留存复盘</text>
  </g>

  <!-- tool tiles row -->
  <g>
    <rect x="300" y="270" width="66" height="56" rx="12" fill="#0f2c26" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="333" cy="292" r="8" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    <rect x="313" y="306" width="40" height="6" rx="3" fill="#2dd4bf" opacity="0.5"/>
    <rect x="380" y="270" width="66" height="56" rx="12" fill="#0f2c26" stroke="#1e5b50" stroke-width="2" opacity="0.55"/>
    <circle cx="413" cy="292" r="8" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.55"/>
    <rect x="393" y="306" width="40" height="6" rx="3" fill="#2dd4bf" opacity="0.3"/>
    <rect x="460" y="270" width="66" height="56" rx="12" fill="#0f2c26" stroke="#1e5b50" stroke-width="2" opacity="0.35"/>
    <circle cx="493" cy="292" r="8" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.35"/>
    <rect x="473" y="306" width="40" height="6" rx="3" fill="#2dd4bf" opacity="0.2"/>
  </g>
</svg>
