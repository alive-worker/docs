  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">家人的卡没问题</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">却总被风控拦下</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">姓名不符 · 地址不符 · 登录地漂移</text>

  <!-- shield with alert mark -->
  <g transform="translate(600,150)">
