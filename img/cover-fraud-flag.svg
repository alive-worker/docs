    <line x1="0" y1="-14" x2="0" y2="12" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="28" r="4" fill="#f87171"/>
  </g>
  <g stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M600 232 v34" stroke-dasharray="4 4"/>
    <path d="M592 258 l8 10 l8 -10" fill="none"/>
  </g>
  <g transform="translate(600,300)">
