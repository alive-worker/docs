<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2418"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6f8f"/>
      <stop offset="1" stop-color="#2a4f66"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#a6822f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- left: house/address card with door number + zip -->
  <g transform="translate(90,105)">
    <rect x="0" y="0" width="230" height="155" rx="16" fill="url(#cardA)" stroke="#a8d8f0" stroke-opacity="0.4"/>
    <!-- house icon -->
    <path d="M28 62 L58 36 L88 62 V102 H28 Z" fill="#eaf6ff" opacity="0.85"/>
    <rect x="48" y="76" width="20" height="26" fill="#2a4f66"/>
    <text x="112" y="58" font-family="Arial, sans-serif" font-size="14" fill="#dff0fb" opacity="0.9">门牌号 House No.</text>
    <text x="112" y="82" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">42</text>
    <text x="20" y="132" font-family="Arial, sans-serif" font-size="14" fill="#dff0fb" opacity="0.9">邮编 ZIP</text>
    <text x="20" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">94107</text>
  </g>

  <!-- right: card issuer record for comparison -->
  <g transform="translate(480,105)">
    <rect x="0" y="0" width="230" height="155" rx="16" fill="url(#cardB)" stroke="#ffe1a3" stroke-opacity="0.4"/>
    <rect x="18" y="20" width="70" height="16" rx="4" fill="#fff7e6" opacity="0.6"/>
    <circle cx="196" cy="28" r="15" fill="#fff7e6" opacity="0.25"/>
    <text x="18" y="68" font-family="Arial, sans-serif" font-size="14" fill="#3a2c0c" opacity="0.85">发卡行登记地址</text>
    <text x="18" y="88" font-family="Arial, sans-serif" font-size="13" fill="#3a2c0c" opacity="0.75">Issuer Billing Record</text>
    <text x="18" y="120" font-family="Arial, sans-serif" font-size="14" fill="#2a1e05">门牌 42 · 邮编 94107</text>
    <path d="M20 138 l8 8 16 -18" stroke="#2a1e05" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <text x="46" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2a1e05">匹配 Match</text>
  </g>

  <!-- middle: compare arrows -->
  <g transform="translate(330,168)">
    <line x1="0" y1="10" x2="140" y2="10" stroke="#e8d9a8" stroke-width="3" stroke-dasharray="6 8" opacity="0.85"/>
    <path d="M132 3 L146 10 L132 17 Z" fill="#e8d9a8" opacity="0.9"/>
    <text x="70" y="-16" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f1e6c2" opacity="0.9">AVS 核对 · Match Check</text>
  </g>

  <!-- bottom-right small shield to denote 3DS is a different mechanism -->
  <g transform="translate(690,270)" opacity="0.9">
    <path d="M20 0 L38 7 V22 C38 34 20 42 20 42 C20 42 2 34 2 22 V7 Z" fill="none" stroke="#9fe3c8" stroke-width="2.5"/>
    <path d="M12 21 l6 6 12 -13" stroke="#9fe3c8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cfe6da" opacity="0.85">≠3DS</text>
  </g>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">AVS地址验证：只核对门牌号与邮编</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cfe6da" opacity="0.85">Address Verification Service — Not the Same as 3D Secure</text>
</svg>
