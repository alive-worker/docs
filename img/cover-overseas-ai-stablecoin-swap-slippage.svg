<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换报价与实际到账金额出现偏差的机制封面图">
  <defs>
    <linearGradient id="bgSlip" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1b12"/>
      <stop offset="1" stop-color="#122a1c"/>
    </linearGradient>
    <linearGradient id="lineSlip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgSlip)"/>
  <!-- faint price-chart grid -->
  <g stroke="#2f5240" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="100" y1="30" x2="100" y2="370"/>
    <line x1="300" y1="30" x2="300" y2="370"/>
    <line x1="500" y1="30" x2="500" y2="370"/>
    <line x1="700" y1="30" x2="700" y2="370"/>
  </g>

  <!-- drifting price path from quote to settlement -->
  <path d="M120 150 C 220 150, 260 120, 340 150 S 460 230, 520 210 S 620 175, 680 190"
        fill="none" stroke="url(#lineSlip)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="120" cy="150" r="7" fill="#34d399"/>
  <circle cx="680" cy="190" r="7" fill="#f59e0b"/>

  <!-- left panel: quote at request time -->
  <g transform="translate(70,230)">
    <rect width="230" height="110" rx="14" fill="#0f2418" stroke="#34d399" stroke-width="2"/>
    <text x="20" y="30" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#a7f3d0">下单时报价</text>
    <text x="20" y="70" font-family="'Menlo','Consolas',monospace" font-size="30" font-weight="700" fill="#d1fae5">99.80 USDT</text>
    <text x="20" y="95" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6ee7b7" opacity="0.85">价格快照 · T+0秒</text>
  </g>

  <!-- right panel: actual settled amount -->
  <g transform="translate(500,230)">
    <rect width="230" height="110" rx="14" fill="#241a0d" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="30" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#fde68a">实际到账</text>
    <text x="20" y="70" font-family="'Menlo','Consolas',monospace" font-size="30" font-weight="700" fill="#fef3c7">99.31 USDT</text>
    <text x="20" y="95" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#fcd34d" opacity="0.85">链上结算 · T+数十秒</text>
  </g>

  <!-- delta callout -->
  <g transform="translate(400,150)">
    <rect x="-46" y="-20" width="92" height="34" rx="17" fill="#1a3527" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Menlo','Consolas',monospace" font-size="15" font-weight="700" fill="#f59e0b">-0.49%</text>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#e7f8ee">报价是快照，到账是结算后的价格</text>
</svg>
