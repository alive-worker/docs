<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI subscription zombie charges after cancellation cover image">
  <defs>
    <linearGradient id="bgGradZom" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0f0f"/>
      <stop offset="1" stop-color="#3a1414"/>
    </linearGradient>
    <radialGradient id="glowZom" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradZom)"/>
  <rect width="800" height="400" fill="url(#glowZom)"/>
  <g stroke="#6b2b2b" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#fca5a5" opacity="0.6">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#fef2f2">Cancelled the plan</text>
  <text x="52" y="156" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f87171">Still got billed</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#fca5a5"/>
  <text x="52" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#fca5a5" opacity="0.85">Zombie charges · Sync failure · Virtual card hard stop</text>

  <!-- skull-ish ghost card medallion -->
  <g transform="translate(610,175)">
    <circle r="88" fill="#2a1010" stroke="#6b2b2b" stroke-width="2"/>
    <path d="M-26 -34 a26 26 0 1 1 52 0 v22 a26 30 0 0 1 -52 0 z" fill="#fca5a5" opacity="0.9"/>
    <circle cx="-10" cy="-30" r="6" fill="#2a1010"/>
    <circle cx="10" cy="-30" r="6" fill="#2a1010"/>
    <path d="M-8 -10 h16 l-4 8 h-8 z" fill="#2a1010"/>
    <path d="M-18 -2 l6 10 M-6 -2 l0 10 M6 -2 l0 10 M18 -2 l-6 10" stroke="#2a1010" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fca5a5">Zombie charge</text>
  </g>

  <!-- repeating charge cycle icon -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <circle cx="330" cy="300" r="24" fill="#2a1010" stroke="#f87171" stroke-width="2"/>
    <text x="330" y="308" text-anchor="middle" font-size="20" fill="#f87171">✕</text>
    <path d="M360 300 h40" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowZom)"/>
    <circle cx="440" cy="300" r="24" fill="#2a1010" stroke="#f87171" stroke-width="2"/>
    <text x="440" y="308" text-anchor="middle" font-size="20" fill="#f87171">$</text>
  </g>
  <defs>
    <marker id="arrowZom" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#fca5a5"/>
    </marker>
  </defs>
</svg>
