<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">对话早就停了，知识库为什么还在按小时扣费？</title>
  <desc id="desc">对话窗口已关闭，知识库计时器仍按小时走动</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122018"/><stop offset="1" stop-color="#0e1a22"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="160" fill="#6a8f4e" opacity=".2"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="44" y="48" font-size="14" fill="#b7d39a" letter-spacing="3">KNOWLEDGE BASE / 2026</text>
    <text x="44" y="108" font-size="32" fill="#f5f4ea" font-weight="700">对话停了，时钟还在走</text>
    <text x="44" y="146" font-size="18" fill="#c9d6c0">窗口空闲，不等于知识库实例已下线。</text>
    <rect x="44" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#6a8f4e"/>
    <text x="62" y="222" font-size="12" fill="#b7d39a">01 规格时长</text>
    <text x="62" y="254" font-size="20" fill="#fff">仍在计时</text>
    <rect x="290" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#8aa86a"/>
    <text x="308" y="222" font-size="12" fill="#c5ddaa">02 向量 / 排序</text>
    <text x="308" y="254" font-size="20" fill="#fff">按 token 另计</text>
    <rect x="536" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#4a6a52"/>
    <text x="554" y="222" font-size="12" fill="#9bb89a">03 问答模型</text>
    <text x="554" y="254" font-size="20" fill="#fff">窗口已关</text>
    <path d="M44 304h712" stroke="#4a6a52"/>
    <text x="44" y="342" font-size="22" fill="#d7e8c4">先拆三笔账，再决定删库</text>
    <text x="44" y="375" font-size="13" fill="#a8bfa0">免费时长只抵标准版规格；删文档不停计算资源。</text>
  </g>
</svg>
