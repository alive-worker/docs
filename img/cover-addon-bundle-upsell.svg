<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅续费默认捆绑付费插件封面图">
  <defs>
    <linearGradient id="bgGradAbu" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#052620"/>
      <stop offset="1" stop-color="#0a3d33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradAbu)"/>
  <g stroke="#0f4a3d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="440" y1="0" x2="440" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="760" y1="0" x2="760" y2="300"/>
  </g>

  <text x="52" y="56" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#2dd4bf" opacity="0.9">默认勾选 · 弹窗话术 · 续费前逐项核对</text>

  <!-- growing receipt bars: base plan then add-ons stack taller each renewal -->
  <g transform="translate(0,260)">
    <rect x="150" y="-50" width="60" height="50" rx="4" fill="#0a3d33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="180" y="-60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5eead4">首月</text>

    <rect x="290" y="-84" width="60" height="84" rx="4" fill="#0a3d33" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="290" y="-84" width="60" height="24" rx="4" fill="#f97316" opacity="0.75"/>
    <text x="320" y="-94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5eead4">+插件A</text>

    <rect x="430" y="-118" width="60" height="118" rx="4" fill="#0a3d33" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="430" y="-118" width="60" height="24" rx="4" fill="#f97316" opacity="0.75"/>
    <rect x="430" y="-90" width="60" height="20" fill="#fb923c" opacity="0.6"/>
    <text x="460" y="-128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5eead4">+插件B</text>

    <rect x="570" y="-158" width="60" height="158" rx="4" fill="#0a3d33" stroke="#f97316" stroke-width="2.5"/>
    <rect x="570" y="-158" width="60" height="24" rx="4" fill="#f97316"/>
    <rect x="570" y="-130" width="60" height="20" fill="#fb923c" opacity="0.7"/>
    <rect x="570" y="-104" width="60" height="20" fill="#fb923c" opacity="0.5"/>
    <text x="600" y="-168" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fdba74">续费账单</text>
  </g>

  <path d="M150 218 q225 -70 480 -8" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
  <path d="M615 202 l15 8 l-4 -17" fill="none" stroke="#f97316" stroke-width="2"/>

  <rect x="0" y="326" width="800" height="74" fill="#032019"/>
  <text x="52" y="360" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#5eead4">插件默认打包续费</text>
  <text x="52" y="388" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#2dd4bf">账单为什么突然涨了一截</text>
</svg>
