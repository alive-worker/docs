<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 工具订阅支付几个账户策略封面图">
  <defs>
    <linearGradient id="bgGradAcct" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#123a56"/>
    </linearGradient>
    <radialGradient id="glowAcct" cx="120" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrAcct" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradAcct)"/>
  <rect width="800" height="400" fill="url(#glowAcct)"/>

  <!-- decorative grid -->
  <g stroke="#1e4f6b" stroke-width="1" opacity="0.35" fill="none">
    <path d="M600 30 h60 v40 h30"/>
    <path d="M620 90 h50 v-20 h35"/>
    <circle cx="600" cy="30" r="2.5" fill="#7dd3fc"/>
    <circle cx="690" cy="70" r="2.5" fill="#7dd3fc"/>
  </g>

  <!-- title -->
  <text x="52" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#f0f9ff">AI 工具订阅支付</text>
  <text x="52" y="134" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#38bdf8">几个账户够用</text>
  <rect x="52" y="148" width="120" height="4" rx="2" fill="#7dd3fc"/>
  <text x="52" y="176" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#7dd3fc" opacity="0.85">账号 · 绑卡 · 风控 · 退款 · 虚拟卡</text>

  <!-- three account tiles on left -->
  <g>
    <rect x="52" y="220" width="130" height="130" rx="14" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="117" cy="258" r="16" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M97 300 q20 -22 40 0" stroke="#7dd3fc" stroke-width="2.5" fill="none"/>
    <text x="117" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9fd8f0">主账号</text>
  </g>
  <g>
    <rect x="200" y="220" width="130" height="130" rx="14" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="265" cy="258" r="16" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M245 300 q20 -22 40 0" stroke="#7dd3fc" stroke-width="2.5" fill="none"/>
    <text x="265" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9fd8f0">备用账号</text>
  </g>
  <g>
    <rect x="348" y="220" width="130" height="130" rx="14" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="413" cy="258" r="16" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M393 300 q20 -22 40 0" stroke="#7dd3fc" stroke-width="2.5" fill="none"/>
    <text x="413" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9fd8f0">共享/团队</text>
  </g>

  <!-- arrows converging -->
  <path d="M478 285 L560 240" stroke="#7dd3fc" stroke-width="2" opacity="0.7" marker-end="url(#arrAcct)"/>
  <path d="M478 285 L560 285" stroke="#7dd3fc" stroke-width="2" opacity="0.7" marker-end="url(#arrAcct)"/>
  <path d="M478 285 L560 330" stroke="#7dd3fc" stroke-width="2" opacity="0.7" marker-end="url(#arrAcct)"/>

  <!-- virtual card -->
  <g>
    <rect x="575" y="200" width="180" height="120" rx="16" fill="#0f2c3d" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="595" y="222" width="42" height="30" rx="6" fill="#1e4f6b" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="601" y="232" width="28" height="4" rx="2" fill="#e0f7ff"/>
    <rect x="601" y="242" width="18" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="595" y="266" width="140" height="7" rx="3.5" fill="#e0f7ff" opacity="0.85"/>
    <rect x="595" y="284" width="90" height="6" rx="3" fill="#7dd3fc" opacity="0.6"/>
    <circle cx="720" cy="240" r="14" fill="#38bdf8" opacity="0.28"/>
    <circle cx="706" cy="240" r="14" fill="#7dd3fc" opacity="0.35"/>
    <text x="665" y="185" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#e0f7ff">虚拟卡承接</text>
  </g>
</svg>
