<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One endpoint, three prices: Flex at batch rates, Fast at a premium that can fall back to standard">
  <rect width="800" height="400" fill="#14201d"/>
  <text x="48" y="52" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#eef2fb">Same call. Why can the price double?</text>
  <g transform="translate(48,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#173a2c" stroke="#7be8b8" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">Flex</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">Sync call · Batch rates</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">Capacity 429 is free</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#7be8b8">Can wait</text>
  </g>
  <g transform="translate(422,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#2a2214" stroke="#e2b15a" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f2d18a">Fast</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#d9c39a">Premium for lower latency</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#d9c39a">Ramp too fast, bill default</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#f2d18a">Read the response</text>
  </g>
  <text x="48" y="348" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">The request parameter is not the invoice</text>
  <text x="752" y="34" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI Access Guide</text>
</svg>
