<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One endpoint, three prices: Flex at batch rates, Fast at a premium that can fall back to standard">
  <rect width="800" height="400" fill="#101612"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">Same call. Three prices.</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#9aab9f">AI Access Guide</text>
  <text x="40" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8fd6b6">Flex</text>
  <rect x="120" y="96" width="210" height="30" rx="7" fill="#173a2c" stroke="#7be8b8" stroke-width="2"/>
  <text x="348" y="117" font-family="Segoe UI, sans-serif" font-size="16" fill="#cfe8dc">Batch rate. A capacity 429 is free.</text>
  <text x="40" y="188" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#d5e2f2">Std</text>
  <rect x="120" y="166" width="360" height="30" rx="7" fill="#1c2836" stroke="#9bb4d4" stroke-width="2"/>
  <text x="498" y="187" font-family="Segoe UI, sans-serif" font-size="16" fill="#d5e2f2">default</text>
  <text x="40" y="258" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f2d18a">Fast</text>
  <rect x="120" y="236" width="560" height="30" rx="7" fill="#2a2214" stroke="#e2b15a" stroke-width="2"/>
  <path d="M620 266 L620 300 L470 300" fill="none" stroke="#e2b15a" stroke-width="2.5"/>
  <polygon points="470,300 482,294 482,306" fill="#e2b15a"/>
  <text x="40" y="332" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f2d18a">Ramp too fast, the bill falls back</text>
  <text x="40" y="368" font-family="Segoe UI, sans-serif" font-size="15" fill="#b7c4b8">The request flag is not the invoice. Read service_tier.</text>
</svg>