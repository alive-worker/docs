<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Successful lines are half price; thinking tokens still bill">

  <rect width="800" height="400" fill="#12160f"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f4f0ea">Half price lands only on success lines</text>
  <text x="760" y="42" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#b7c9a4">AI Access Guide</text>
  <text x="56" y="102" font-family="Segoe UI, sans-serif" font-size="14" fill="#8aa080">Result file</text>
  <text x="640" y="102" font-family="Segoe UI, sans-serif" font-size="14" fill="#8aa080">This line</text>
  <rect x="40" y="116" width="720" height="44" rx="8" fill="#1c2a18" stroke="#7be8b8" stroke-width="2"/>
  <text x="60" y="144" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8fd6b6">Success</text>
  <text x="170" y="144" font-family="Segoe UI, sans-serif" font-size="16" fill="#d7ead0">50% of realtime</text>
  <text x="520" y="144" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f2d18a">Thinking still output</text>
  <rect x="40" y="170" width="720" height="44" rx="8" fill="#241812"/>
  <text x="60" y="198" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#c4a27a">Failed</text>
  <text x="160" y="198" font-family="Segoe UI, sans-serif" font-size="16" fill="#a89078">This line does not bill</text>
  <text x="680" y="198" font-family="Segoe UI, sans-serif" font-size="16" fill="#a89078">0</text>
  <rect x="40" y="224" width="720" height="44" rx="8" fill="#241812"/>
  <text x="60" y="252" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#c4a27a">Not reached</text>
  <text x="200" y="252" font-family="Segoe UI, sans-serif" font-size="16" fill="#a89078">Does not run, does not bill</text>
  <text x="680" y="252" font-family="Segoe UI, sans-serif" font-size="16" fill="#a89078">0</text>
  <text x="40" y="318" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">The file omits the thinking text</text>
  <text x="40" y="352" font-family="Segoe UI, sans-serif" font-size="16" fill="#c5d4b8">Output tokens can be longer than the answer you download.</text>

</svg>
