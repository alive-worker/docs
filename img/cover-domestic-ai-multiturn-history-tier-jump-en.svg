<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Past the bracket, the whole request takes the higher tier.">
  <rect width="800" height="400" fill="#101612"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Past the line, the whole bill jumps</text>
  <text x="760" y="44" text-anchor="end" fill="#e0913f" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">AI Access Guide</text>
  <rect x="40" y="88" width="720" height="196" rx="16" fill="#3a2a16"/>
  <line x1="40" y1="132" x2="760" y2="132" stroke="#f2d18a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="64" y="118" fill="#f2d18a" font-family="Segoe UI, sans-serif" font-size="16">Above the line</text>
  <text x="64" y="210" fill="#f4f0ea" font-family="Segoe UI, sans-serif" font-size="40" font-weight="700">One tier, all of it</text>
  <text x="40" y="328" fill="#c4b59a" font-family="Segoe UI, sans-serif" font-size="16">Both sides share one tier. The overflow is not a separate price.</text>
  <text x="40" y="360" fill="#c4b59a" font-family="Segoe UI, sans-serif" font-size="16">History stays in messages. The new line does not pick the tier.</text>
</svg>
