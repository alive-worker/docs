<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅涨价未提前通知去哪里查封面图">
  <defs>
    <radialGradient id="bgGradPh" cx="400" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a0d12"/>
      <stop offset="1" stop-color="#160305"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradPh)"/>

  <text x="400" y="54" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" letter-spacing="2" fill="#fca5a5" opacity="0.9">悄悄涨价 · 没提前通知 · 去哪里查</text>

  <!-- giant struck-through old price next to bigger new price -->
  <g transform="translate(400,220)">
    <text x="-190" y="0" text-anchor="middle" font-size="88" font-weight="700" fill="#7a2530" opacity="0.75">$19</text>
    <line x1="-260" y1="-24" x2="-120" y2="-40" stroke="#f87171" stroke-width="6"/>

    <path d="M-70 -20 l40 20 l-40 20" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="150" y="10" text-anchor="middle" font-size="120" font-weight="700" fill="#ef4444">$29</text>
  </g>

  <rect x="300" y="290" width="200" height="40" rx="20" fill="#3a0d12" stroke="#ef4444" stroke-width="2.5"/>
  <text x="400" y="316" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fca5a5">+52.6%</text>

  <text x="400" y="368" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f87171" opacity="0.85">账单邮件 · 官网条款页 · 客服工单三处交叉核对</text>
</svg>
