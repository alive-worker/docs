<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Chat Stopped, Knowledge Base Still Bills</title>
  <desc id="desc">Chat window closed while the knowledge-base meter keeps running</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122018"/><stop offset="1" stop-color="#0e1a22"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="160" fill="#6a8f4e" opacity=".2"/>
  <g font-family="Segoe UI, Segoe UI Symbol, sans-serif">
    <text x="44" y="48" font-size="14" fill="#b7d39a" letter-spacing="3">KNOWLEDGE BASE / 2026</text>
    <text x="44" y="108" font-size="32" fill="#f5f4ea" font-weight="700">Chat closed. Meter running.</text>
    <text x="44" y="146" font-size="18" fill="#c9d6c0">An idle window is not an offline knowledge base.</text>
    <rect x="44" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#6a8f4e"/>
    <text x="62" y="222" font-size="12" fill="#b7d39a">01 SPEC HOURS</text>
    <text x="62" y="254" font-size="20" fill="#fff">Still ticking</text>
    <rect x="290" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#8aa86a"/>
    <text x="308" y="222" font-size="12" fill="#c5ddaa">02 EMBED / RERANK</text>
    <text x="308" y="254" font-size="20" fill="#fff">Token ledger</text>
    <rect x="536" y="188" width="220" height="90" rx="12" fill="#1a261c" stroke="#4a6a52"/>
    <text x="554" y="222" font-size="12" fill="#9bb89a">03 ANSWER MODEL</text>
    <text x="554" y="254" font-size="20" fill="#fff">Window off</text>
    <path d="M44 304h712" stroke="#4a6a52"/>
    <text x="44" y="342" font-size="22" fill="#d7e8c4">Split three ledgers, then delete</text>
    <text x="44" y="375" font-size="13" fill="#a8bfa0">Free hours cover standard spec; deleting files does not stop compute.</text>
  </g>
</svg>
