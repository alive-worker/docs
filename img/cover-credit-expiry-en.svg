<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI subscription unused credits expiring at cycle end">
  <defs>
    <linearGradient id="bgCee" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141033"/>
      <stop offset="1" stop-color="#241a5c"/>
    </linearGradient>
    <radialGradient id="glowCee" cx="400" cy="180" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgCee)"/>
  <rect width="800" height="400" fill="url(#glowCee)"/>

  <text x="60" y="56" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#e0e7ff">Unused Credits, Gone</text>
  <text x="60" y="84" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#a5b4fc" opacity="0.9">Tokens · generations · prepaid balance</text>

  <g transform="translate(400,220)">
    <path d="M-70 -110 h140 M-70 110 h140" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M-70 -110 L70 -110 L10 0 L70 110 L-70 110 L-10 0 Z" fill="none" stroke="#818cf8" stroke-width="3.5"/>
    <clipPath id="topBulbe"><path d="M-64 -104 L64 -104 L10 -4 L-10 -4 Z"/></clipPath>
    <g clip-path="url(#topBulbe)">
      <rect x="-64" y="-104" width="128" height="34" fill="#c7d2fe"/>
    </g>
    <clipPath id="botBulbe"><path d="M-10 4 L10 4 L64 104 L-64 104 Z"/></clipPath>
    <g clip-path="url(#botBulbe)">
      <rect x="-64" y="72" width="128" height="32" fill="#4f46e5"/>
    </g>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fde68a" stroke-width="3"/>
    <text x="0" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f87171">0</text>
    <text x="0" y="-130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#c7d2fe" opacity="0.85">Cycle ends</text>
  </g>

  <g transform="translate(140,260)" font-family="Arial,Helvetica,sans-serif">
    <rect x="-16" y="-20" width="170" height="40" rx="20" fill="#241a5c" stroke="#f87171" stroke-width="2"/>
    <text x="69" y="6" text-anchor="middle" font-size="13" fill="#f87171" font-weight="700">No rollover, no refund</text>
  </g>
  <text x="400" y="368" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#a5b4fc" opacity="0.85">Credit balances reset when the billing cycle ends</text>
</svg>
