<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅降级为免费版后历史数据是否保留封面图">
  <defs>
    <linearGradient id="bgGradDdl" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031a2e"/>
      <stop offset="1" stop-color="#063354"/>
    </linearGradient>
    <pattern id="hatchDdl" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#0c4570" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradDdl)"/>
  <rect width="800" height="400" fill="url(#hatchDdl)"/>

  <text x="400" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#93c5fd">降级到免费版</text>
  <text x="400" y="98" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#38bdf8" opacity="0.9">历史数据还能留住吗</text>

  <!-- hourglass with data squares falling through and vanishing -->
  <g transform="translate(400,225)">
    <path d="M-70 -90 h140 v20 l-58 60 l58 60 v20 h-140 v-20 l58 -60 l-58 -60 z" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-70" y="-100" width="140" height="12" rx="4" fill="#0c4570"/>
    <rect x="-70" y="88" width="140" height="12" rx="4" fill="#0c4570"/>

    <rect x="-40" y="-72" width="16" height="16" fill="#7dd3fc" opacity="0.85"/>
    <rect x="-10" y="-64" width="16" height="16" fill="#7dd3fc" opacity="0.65"/>
    <rect x="20" y="-72" width="16" height="16" fill="#7dd3fc" opacity="0.5"/>

    <rect x="-8" y="-6" width="16" height="16" fill="#7dd3fc" opacity="0.9"/>

    <rect x="-10" y="66" width="16" height="16" fill="#7dd3fc" opacity="0.35"/>
    <rect x="14" y="74" width="16" height="16" fill="#374155" opacity="0.5" stroke="#f87171" stroke-width="1.5"/>
    <text x="22" y="86" text-anchor="middle" font-size="12" fill="#f87171">✕</text>
  </g>

  <polygon points="640,330 700,330 715,355 700,380 640,380 625,355" fill="#063354" stroke="#f87171" stroke-width="2.5"/>
  <text x="670" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#fca5a5">留存期</text>

  <text x="130" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#38bdf8" opacity="0.85">存储配额缩减</text>
  <text x="130" y="364" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#38bdf8" opacity="0.85">导出权限被收回</text>
  <text x="130" y="388" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7dd3fc" font-weight="700">降级前先自己备份一份</text>
</svg>
