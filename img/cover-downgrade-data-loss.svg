<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅降级到免费档后数据保留期限封面图">
  <defs>
    <linearGradient id="bgGradDdl" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0e3a34"/>
    </linearGradient>
    <radialGradient id="glowDdl" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradDdl)"/>
  <rect width="800" height="400" fill="url(#glowDdl)"/>
  <g stroke="#1e5b50" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5eead4" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">降级到免费档</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">数据说清就清</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">存储配额收缩 · 导出权限收回 · 降级前先备份</text>

  <!-- folder with retention countdown, then storage bar getting revoked -->
  <defs>
    <marker id="arrowDdl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <g transform="translate(600,146)">
    <rect x="-96" y="-64" width="192" height="128" rx="16" fill="#123832" stroke="#1e5b50" stroke-width="2"/>
    <path d="M-80 -30 h30 l8 10 h38 v34 a4 4 0 0 1 -4 4 h-68 a4 4 0 0 1 -4 -4 v-40 a4 4 0 0 1 4 -4 z" fill="#0f2c26" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="-44" cy="8" r="16" fill="#123832" stroke="#f87171" stroke-width="2"/>
    <path d="M-44 0 v10 l7 5" stroke="#f87171" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-6 -6 h20" stroke="#5eead4" stroke-width="2" marker-end="url(#arrowDdl)"/>
    <rect x="20" y="-24" width="76" height="20" rx="5" fill="#0f2c26" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="20" y="-24" width="24" height="20" rx="5" fill="#2dd4bf" opacity="0.55"/>
    <circle cx="58" cy="24" r="22" fill="#3a1414" stroke="#f87171" stroke-width="2"/>
    <text x="58" y="32" text-anchor="middle" font-size="18" fill="#f87171">✕</text>
    <text x="0" y="52" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5eead4">保留倒计时</text>
  </g>
  <g stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M600 210 v34" stroke-dasharray="4 4"/>
    <path d="M592 236 l8 10 l8 -10" fill="none"/>
  </g>
  <g transform="translate(600,296)">
    <rect x="-78" y="-24" width="156" height="48" rx="8" fill="#123832" stroke="#f87171" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f87171" font-weight="700">数据被清除</text>
  </g>
  <text x="600" y="350" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5eead4" opacity="0.85">存储配额收缩 · 导出权限收回</text>
</svg>
