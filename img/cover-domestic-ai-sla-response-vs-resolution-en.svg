<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A ticket clock pointing at response time, next to two progress bars comparing a completed response bar against a still-in-progress resolution bar">
  <defs>
    <linearGradient id="bgGradRvrEn" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14201d"/>
      <stop offset="1" stop-color="#1a2a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradRvrEn)"/>

  <!-- left: ticket clock -->
  <g transform="translate(150,150)">
    <rect x="-70" y="-90" width="140" height="34" rx="8" fill="#20342f" stroke="#4fae8a" stroke-width="3"/>
    <text x="0" y="-67" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#9fe6c4">Ticket #500</text>
    <circle cx="0" cy="20" r="68" fill="#1c2c28" stroke="#7be8b8" stroke-width="4"/>
    <line x1="0" y1="20" x2="0" y2="-24" stroke="#eef2fb" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="34" y2="20" stroke="#f2d18a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="5" fill="#eef2fb"/>
  </g>
  <text x="150" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">Batch errors, ticket filed</text>

  <!-- right: two progress bars -->
  <g transform="translate(430,110)">
    <text x="0" y="-14" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#eef2fb">Response time</text>
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#20342f" stroke="#2a4038" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#4fae8a"/>
    <text x="310" y="19" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#7be8b8">Done</text>
  </g>
  <g transform="translate(430,190)">
    <text x="0" y="-14" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#eef2fb">Resolution time</text>
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#20342f" stroke="#2a4038" stroke-width="2"/>
    <rect x="0" y="0" width="95" height="26" rx="13" fill="#f2d18a"/>
    <text x="310" y="19" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#f2d18a">Pending?</text>
  </g>
  <text x="430" y="270" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">Response &#8800; resolution, per your service agreement</text>

  <text x="60" y="60" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#eef2fb">Ticket "responded to" &#8800; issue resolved</text>
  <text x="736" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI Access Guide</text>
</svg>
