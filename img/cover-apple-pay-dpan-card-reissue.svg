<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2418"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6f8f"/>
      <stop offset="1" stop-color="#2a4f66"/>
    </linearGradient>
    <linearGradient id="oldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8f98"/>
      <stop offset="1" stop-color="#5c6068"/>
    </linearGradient>
    <linearGradient id="newCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#a6822f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- left: phone/wallet with device token chip -->
  <g transform="translate(95,95)">
    <rect x="0" y="0" width="150" height="210" rx="20" fill="url(#phone)" stroke="#a8d8f0" stroke-opacity="0.4"/>
    <rect x="14" y="18" width="122" height="150" rx="10" fill="#0f2418" opacity="0.35"/>
    <rect x="28" y="70" width="94" height="60" rx="8" fill="#eaf6ff" opacity="0.9"/>
    <rect x="38" y="82" width="26" height="18" rx="3" fill="#2a4f66"/>
    <text x="38" y="118" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2a4f66">DPAN</text>
    <text x="38" y="130" font-family="Arial, sans-serif" font-size="9" fill="#2a4f66" opacity="0.85">•••• 7731</text>
    <circle cx="75" cy="150" r="8" fill="none" stroke="#eaf6ff" stroke-width="2" opacity="0.8"/>
    <text x="75" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dff0fb" opacity="0.9">设备安全芯片</text>
    <text x="75" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dff0fb" opacity="0.8">Secure Element</text>
  </g>

  <!-- middle: sync arrows between old and new card -->
  <g transform="translate(330,150)">
    <path d="M0 20 C40 -10, 100 -10, 140 20" stroke="#e8d9a8" stroke-width="3" fill="none" stroke-dasharray="6 8" opacity="0.85"/>
    <path d="M132 12 L146 20 L131 26 Z" fill="#e8d9a8" opacity="0.9"/>
    <path d="M140 55 C100 85, 40 85, 0 55" stroke="#9fe3c8" stroke-width="3" fill="none" stroke-dasharray="6 8" opacity="0.85"/>
    <path d="M8 62 L-6 55 L9 48 Z" fill="#9fe3c8" opacity="0.9"/>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f1e6c2" opacity="0.9">账户更新服务</text>
    <text x="70" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f1e6c2" opacity="0.75">Account Updater</text>
  </g>

  <!-- right: old card fading out, new card appearing -->
  <g transform="translate(555,105)">
    <rect x="0" y="34" width="150" height="95" rx="14" fill="url(#oldCard)" opacity="0.4"/>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="12" fill="#eef0f2" opacity="0.7">旧实体卡</text>
    <text x="18" y="90" font-family="Arial, sans-serif" font-size="11" fill="#eef0f2" opacity="0.55">Old Card · Reissued</text>
    <rect x="20" y="0" width="150" height="95" rx="14" fill="url(#newCard)" stroke="#ffe1a3" stroke-opacity="0.5"/>
    <text x="38" y="34" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2a1e05">新实体卡</text>
    <text x="38" y="53" font-family="Arial, sans-serif" font-size="11" fill="#2a1e05" opacity="0.75">New Card · Same Account</text>
    <path d="M40 68 l8 8 16 -18" stroke="#2a1e05" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <text x="66" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2a1e05">自动同步</text>
  </g>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">换实体卡，Apple Pay订阅为什么不用管</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cfe6da" opacity="0.85">Device Token (DPAN) &amp; Card Account Updater</text>
</svg>
