<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free trial silently converts to paid auto-renewal cover image">
  <defs>
    <radialGradient id="bgGradFtEn" cx="400" cy="200" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2b06"/>
      <stop offset="1" stop-color="#0c1403"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradFtEn)"/>

  <path id="arcFtEn" d="M220 100 A200 200 0 0 1 580 100" fill="none"/>
  <text font-family="sans-serif" font-size="22" font-weight="700" fill="#bef264">
    <textPath href="#arcFtEn" startOffset="50%" text-anchor="middle">When the Free Trial Ends</textPath>
  </text>

  <g transform="translate(400,235)">
    <circle r="92" fill="#111a04" stroke="#a3e635" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#d9f99d" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="40" y2="18" stroke="#d9f99d" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#a3e635"/>

    <g fill="#ef4444">
      <polygon points="-80,46 -68,46 -74,72"/>
      <polygon points="-56,60 -44,60 -50,86"/>
      <polygon points="-28,70 -16,70 -22,96"/>
      <polygon points="4,74 16,74 10,100"/>
      <polygon points="36,70 48,70 42,96"/>
      <polygon points="64,58 76,58 70,84"/>
    </g>
  </g>

  <rect x="290" y="340" width="220" height="36" rx="18" fill="#1c2b06" stroke="#a3e635" stroke-width="2.5"/>
  <text x="400" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#d9f99d">It Quietly Becomes a Paid Plan</text>

  <text x="130" y="220" font-family="sans-serif" font-size="12.5" fill="#a3e635" opacity="0.85">Last 3 days of trial</text>
  <text x="130" y="244" font-family="sans-serif" font-size="12.5" fill="#a3e635" opacity="0.85">Set a calendar reminder</text>
