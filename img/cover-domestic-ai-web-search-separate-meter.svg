<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="模型 token 已对上，联网搜索仍按次另计一笔">
  <rect width="800" height="400" fill="#14201d"/>
  <text x="48" y="52" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#eef2fb">模型账单对上了，搜索费还在扣</text>
  <g transform="translate(48,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#173a2c" stroke="#7be8b8" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">模型 token</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#b6d6c8">输入 / 输出已对上</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#b6d6c8">免费额度可能抵这一列</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#7be8b8">不是全账</text>
  </g>
  <g transform="translate(422,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#2a2214" stroke="#e2b15a" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">联网搜索</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#d9c39a">策略费按次 · 无免费次数</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#d9c39a">网页再计入输入 token</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#f2d18a">另一行账单</text>
  </g>
  <text x="48" y="348" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#b6d6c8">enable_search 留在代码里，控制台不打开也会继续扣</text>
  <text x="752" y="34" text-anchor="end" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI服务指南</text>
</svg>
