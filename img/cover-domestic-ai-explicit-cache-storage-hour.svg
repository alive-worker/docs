<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="命中按折扣计，显式缓存存储从创建起按小时扣">

  <rect width="800" height="400" fill="#12160f"/>
  <text x="40" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">对话停了，小时格还在亮</text>
  <text x="760" y="42" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#d4c48a">AI服务指南</text>
  <circle cx="150" cy="210" r="92" fill="#1c1810" stroke="#e2b15a" stroke-width="3"/>
  <g stroke="#8a7a58" stroke-width="2">
    <line x1="150" y1="132" x2="150" y2="144"/>
    <line x1="150" y1="276" x2="150" y2="288"/>
    <line x1="72" y1="210" x2="84" y2="210"/>
    <line x1="216" y1="210" x2="228" y2="210"/>
  </g>
  <line x1="150" y1="210" x2="150" y2="150" stroke="#f2d18a" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="210" x2="196" y2="232" stroke="#f4f0ea" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="210" r="5" fill="#f2d18a"/>
  <text x="150" y="332" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#e6d3b0">显式缓存</text>
  <rect x="290" y="130" width="470" height="36" rx="8" fill="#3a2e14" stroke="#e2b15a" stroke-width="2"/>
  <text x="310" y="154" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#f2d18a">14:00  创建，这一小时就计存储</text>
  <rect x="290" y="178" width="470" height="36" rx="8" fill="#3a2e14" stroke="#e2b15a" stroke-width="2"/>
  <text x="310" y="202" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#f2d18a">15:00  对话已停，存储继续</text>
  <rect x="290" y="226" width="470" height="36" rx="8" fill="#3a2e14" stroke="#e2b15a" stroke-width="2"/>
  <text x="310" y="250" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#f2d18a">16:00  不调用也扣，不足一小时按一小时</text>
  <text x="290" y="310" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#cbbfa8">隐式缓存不收存储费，命中也不保证。再用不会刷新过期时间。</text>

</svg>
