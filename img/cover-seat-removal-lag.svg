<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="团队席位移除后账单未同步更新封面图">
  <defs>
    <linearGradient id="bgSrl" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062318"/>
      <stop offset="1" stop-color="#0b3d27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgSrl)"/>

  <text x="60" y="60" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#dcfce7">移除了席位</text>
  <text x="60" y="88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#4ade80">账单却没变</text>

  <!-- row of 5 seat icons across the middle, one removed with ghost trail -->
  <g transform="translate(0,220)">
    <g transform="translate(120,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(250,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(400,0)" opacity="0.9">
      <circle r="30" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="5 5"/>
      <circle cy="-8" r="9" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <path d="M-12 -12 l24 24 M12 -12 l-24 24" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(0,58)" opacity="0.85">
        <circle r="12" fill="none" stroke="#fca5a5" stroke-width="2"/>
        <path d="M0 -12 v12 l8 6" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="24" y="5" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#fca5a5">延迟生效</text>
      </g>
    </g>
    <g transform="translate(550,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(680,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
  </g>

  <rect x="290" y="330" width="220" height="42" rx="21" fill="#0b3d27" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#fca5a5" font-weight="700">该席位仍在计费</text>
</svg>
