<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="成功行按实时价一半计，思考token仍算输出">

  <rect width="800" height="400" fill="#12160f"/>
  <text x="40" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">半价只打在成功的行上</text>
  <text x="760" y="42" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b7c9a4">AI服务指南</text>
  <text x="56" y="102" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#8aa080">结果文件</text>
  <text x="620" y="102" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#8aa080">这一行</text>
  <rect x="40" y="116" width="720" height="44" rx="8" fill="#1c2a18" stroke="#7be8b8" stroke-width="2"/>
  <text x="60" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#8fd6b6">成功</text>
  <text x="140" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#d7ead0">实时价的 50%</text>
  <text x="620" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#f2d18a">思考仍按输出</text>
  <rect x="40" y="170" width="720" height="44" rx="8" fill="#241812"/>
  <text x="60" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#c4a27a">失败</text>
  <text x="140" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#a89078">不计这一行</text>
  <text x="620" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#a89078">0</text>
  <rect x="40" y="224" width="720" height="44" rx="8" fill="#241812"/>
  <text x="60" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#c4a27a">窗口没轮到</text>
  <text x="220" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#a89078">不执行，也不计费</text>
  <text x="620" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#a89078">0</text>
  <text x="40" y="318" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">结果文件不带回思考文本</text>
  <text x="40" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#c5d4b8">输出 token 可以比下载到的答案长。不能用字数去对账。</text>

</svg>
