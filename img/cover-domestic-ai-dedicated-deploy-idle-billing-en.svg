<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Per-token billing stops with no calls. Dedicated capacity keeps billing by the hour.">
  <rect width="800" height="400" fill="#12160f"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">The API is idle. The bar is not.</text>
  <text x="760" y="44" text-anchor="end" fill="#b7c9a4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI Access Guide</text>
  <text x="40" y="130" fill="#8fd6b6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">Per token</text>
  <rect x="180" y="110" width="160" height="28" rx="6" fill="#1c3a2c"/>
  <text x="360" y="130" fill="#8aa080" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">Stops at zero calls</text>
  <text x="40" y="210" fill="#f2d18a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">Dedicated</text>
  <rect x="180" y="190" width="540" height="28" rx="6" fill="#e2b15a"/>
  <text x="180" y="262" fill="#d9c39a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Running bills by the hour. Deleting a key does not stop it.</text>
  <text x="40" y="340" fill="#c5d4b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">PTU bills bought capacity. Overflow can add a token charge.</text>
</svg>
