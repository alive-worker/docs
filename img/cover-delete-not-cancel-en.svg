  </defs>
  <polygon points="0,0 460,0 340,400 0,400" fill="url(#bgLEn)"/>
  <polygon points="460,0 800,0 800,400 340,400" fill="url(#bgREn)"/>
  <line x1="460" y1="0" x2="340" y2="400" stroke="#fb923c" stroke-width="3" opacity="0.8"/>

  <g transform="translate(170,168)">
