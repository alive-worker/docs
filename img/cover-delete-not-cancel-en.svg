    <line x1="-16" y1="-24" x2="-12" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
    <line x1="0" y1="-24" x2="0" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
    <line x1="16" y1="-24" x2="12" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
  </g>
  <text x="170" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fde68a">Account Deleted</text>

