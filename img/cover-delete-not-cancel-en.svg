  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fde68a">Delete ≠ Cancel Subscription</text>
  <text x="400" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fb923c">Two separate systems — cancel billing first</text>
