<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The visible answer is short; reasoning tokens still bill as output">

  <rect width="800" height="400" fill="#12141c"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f4f0ea">The sentence is short. The bill is the reasoning.</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#b7b4d4">AI Access Guide</text>
  <path d="M0 168 H800" fill="none" stroke="#6d7ea8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="158" font-family="Segoe UI, sans-serif" font-size="13" fill="#9aa6c8">Screen</text>
  <rect x="230" y="96" width="340" height="52" rx="26" fill="#2a3148" stroke="#c9d2ee" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f4f0ea">Short visible answer</text>
  <path d="M80 210 C 200 190, 320 240, 440 210 S 680 190, 760 220 L 760 360 L 40 360 L 40 220 Z" fill="#1a2033" stroke="#8b7fd4" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#d7d0f2">Reasoning tokens</text>
  <text x="400" y="304" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#b7b0d8">Invisible, still billed as output</text>
  <text x="40" y="388" font-family="Segoe UI, sans-serif" font-size="15" fill="#9aa6c8">The limit counts reasoning and the answer together. It can end with no text.</text>

</svg>
