<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 订阅取消后仍被扣款的僵尸扣款封面图">
  <defs>
    <linearGradient id="bgZom2" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#20242e"/>
    </linearGradient>
    <radialGradient id="glowZom2" cx="400" cy="140" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgZom2)"/>
  <rect width="800" height="400" fill="url(#glowZom2)"/>

  <!-- large centered ghost holding a receipt -->
  <g transform="translate(360,180)">
    <path d="M-70 30 V-30 a70 70 0 0 1 140 0 V30 l-18 -16 l-18 16 l-18 -16 l-18 16 l-18 -16 z" fill="#334155" stroke="#94a3b8" stroke-width="2.5" opacity="0.92"/>
    <circle cx="-24" cy="-14" r="7" fill="#e2e8f0"/>
    <circle cx="24" cy="-14" r="7" fill="#e2e8f0"/>
    <path d="M-16 12 q16 14 32 0" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(478,150)">
    <rect x="-30" y="-40" width="60" height="80" rx="6" fill="#1a1c22" stroke="#f87171" stroke-width="2.5"/>
    <line x1="-18" y1="-24" x2="18" y2="-24" stroke="#fca5a5" stroke-width="2"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#fca5a5" stroke-width="2" opacity="0.7"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#fca5a5" stroke-width="2" opacity="0.5"/>
    <text x="0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#f87171">$</text>
  </g>

  <g transform="translate(300,60)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <circle r="18" fill="#0f2417" stroke="#4ade80" stroke-width="2.5"/>
    <path d="M-7 0 l5 6 l10 -12" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="6" font-size="14" fill="#4ade80">已在平台取消</text>
  </g>

  <rect x="150" y="316" width="500" height="56" rx="12" fill="#1a1c22" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="342" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">取消了订阅，钱还在扣</text>
  <text x="400" y="362" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#f87171">僵尸扣款 · 第三方计费平台状态脱节</text>
</svg>
