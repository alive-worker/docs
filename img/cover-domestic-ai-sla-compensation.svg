<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SLA服务等级协议只覆盖服务可用性，赔偿以代金券折抵而非生成内容质量示意图">
  <defs>
    <linearGradient id="bgGradSla" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14201d"/>
      <stop offset="1" stop-color="#1a2a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradSla)"/>

  <!-- left: SLA document / contract sheet -->
  <g transform="translate(190,150)">
    <path d="M-80 -100 L40 -100 L80 -60 L80 100 L-80 100 Z" fill="#20342f" stroke="#4fae8a" stroke-width="3"/>
    <path d="M40 -100 L40 -60 L80 -60 Z" fill="#2a4a40"/>
    <line x1="-56" y1="-40" x2="52" y2="-40" stroke="#7be8b8" stroke-width="3" opacity="0.7"/>
    <line x1="-56" y1="-14" x2="52" y2="-14" stroke="#7be8b8" stroke-width="3" opacity="0.55"/>
    <line x1="-56" y1="12" x2="30" y2="12" stroke="#7be8b8" stroke-width="3" opacity="0.4"/>
    <text x="-8" y="70" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#9fe6c4">SLA 服务协议</text>
  </g>
  <text x="80" y="290" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">条款覆盖可用性 · 不覆盖内容质量</text>

  <!-- center: availability percentage gauge -->
  <g transform="translate(410,150)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#2a4038" stroke-width="14"/>
    <path d="M0 -72 A72 72 0 1 1 -68 -22" fill="none" stroke="#f2d18a" stroke-width="14" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#f2d18a">%</text>
    <text x="0" y="34" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#eef2fb">可用性承诺</text>
  </g>
  <text x="410" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">具体数字以官方SLA文档为准</text>

  <!-- right: compensation voucher -->
  <g transform="translate(620,150)">
    <rect x="-78" y="-46" width="156" height="92" rx="14" fill="#2a2038" stroke="#c98be0" stroke-width="3"/>
    <circle cx="-78" cy="0" r="10" fill="#14201d"/>
    <circle cx="78" cy="0" r="10" fill="#14201d"/>
    <line x1="-48" y1="-46" x2="-48" y2="46" stroke="#c98be0" stroke-width="2" stroke-dasharray="4 5" opacity="0.6"/>
    <text x="14" y="8" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#e6c4f7">代金券</text>
    <text x="-63" y="8" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#e6c4f7">¥</text>
  </g>
  <text x="620" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">需主动申请 · 提供中断日志证据</text>

  <!-- arrows connecting -->
  <g stroke="#4fae8a" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.5">
    <path d="M290 150 L338 150"/>
    <path d="M482 150 L542 150"/>
  </g>

  <text x="60" y="60" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#eef2fb">SLA不保内容质量，只保可用性</text>
  <text x="736" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI服务指南</text>
</svg>
