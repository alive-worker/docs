<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="月度充值上限只限制自动买积分，硬限额要另开开关才挡请求">
  <rect width="800" height="400" fill="#14110e"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">月度上限没挡住这笔</text>
  <text x="760" y="44" text-anchor="end" fill="#d4c4a8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI服务指南</text>
  <text x="40" y="150" fill="#c4a27a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">余额</text>
  <text x="40" y="214" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="64" font-weight="700">仍在降</text>
  <rect x="430" y="120" width="300" height="110" rx="16" fill="#241812" stroke="#5a4030" stroke-width="2"/>
  <circle cx="490" cy="175" r="22" fill="#3a2a22" stroke="#e2b15a" stroke-width="3"/>
  <circle cx="482" cy="175" r="8" fill="#e2b15a"/>
  <text x="530" y="168" fill="#f2d18a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">硬限额</text>
  <text x="530" y="196" fill="#c4a27a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">开关没开</text>
  <text x="40" y="300" fill="#d9c39a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">月度充值上限只限制自动买积分。已有积分还能花。</text>
  <text x="40" y="340" fill="#a89078" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">告警不停流量。对账先看 error.code。</text>
</svg>
