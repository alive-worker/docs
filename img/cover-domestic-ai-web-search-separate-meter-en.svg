<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Token line matches, web search still bills per call">
  <rect width="800" height="400" fill="#14201d"/>
  <text x="48" y="52" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#eef2fb">Token bill matches. Search still charges</text>
  <g transform="translate(48,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#173a2c" stroke="#7be8b8" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">Model tokens</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">Input and output match</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">Free quota may cover this</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#7be8b8">Not the whole bill</text>
  </g>
  <g transform="translate(422,100)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#2a2214" stroke="#e2b15a" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f2d18a">Web search</text>
    <text x="165" y="84" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#d9c39a">Per-call fee, no free calls</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#d9c39a">Pages also add input tokens</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f2d18a">A second line</text>
  </g>
  <text x="48" y="348" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#b6d6c8">enable_search left in code keeps charging with the console closed</text>
  <text x="752" y="34" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI Access Guide</text>
</svg>
