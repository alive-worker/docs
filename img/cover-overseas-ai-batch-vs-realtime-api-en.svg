<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Realtime API costs full price, batch API half price, same model two lanes">
  <rect width="800" height="400" fill="#12161c"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">Same model. Two different clocks.</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#9bb0c4">AI Access Guide</text>
  <rect x="56" y="100" width="86" height="210" rx="10" fill="#2a2214" stroke="#e2b15a" stroke-width="2.5"/>
  <text x="99" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f2d18a">Live</text>
  <text x="99" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#e6d3b0">Full</text>
  <text x="99" y="268" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#e6d3b0">Now</text>
  <rect x="190" y="246" width="540" height="64" rx="10" fill="#173a2c" stroke="#7be8b8" stroke-width="2.5"/>
  <text x="214" y="274" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">Batch</text>
  <text x="214" y="298" font-family="Segoe UI, sans-serif" font-size="15" fill="#cfe8dc">About half price, window up to 24 hours</text>
  <text x="700" y="286" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="14" fill="#cfe8dc">24h</text>
  <text x="190" y="352" font-family="Segoe UI, sans-serif" font-size="15" fill="#b7c6d4">You are buying the wait, not another model. Expiry bills finished lines only.</text>
</svg>