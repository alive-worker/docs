  <path d="M545 330 L600 330" stroke="#7dd3fc" stroke-width="2" opacity="0.7" marker-end="url(#arrActc)"/>
  <g>
    <rect x="612" y="286" width="130" height="26" rx="6" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="622" y="296" width="70" height="6" rx="3" fill="#7dd3fc" opacity="0.7"/>
    <circle cx="730" cy="299" r="5" fill="#38bdf8"/>
    <rect x="612" y="318" width="130" height="26" rx="6" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="622" y="328" width="86" height="6" rx="3" fill="#7dd3fc" opacity="0.6"/>
    <circle cx="730" cy="331" r="5" fill="#38bdf8"/>
    <rect x="612" y="350" width="130" height="26" rx="6" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="622" y="360" width="54" height="6" rx="3" fill="#7dd3fc" opacity="0.5"/>
    <circle cx="730" cy="363" r="5" fill="#38bdf8"/>
  </g>
