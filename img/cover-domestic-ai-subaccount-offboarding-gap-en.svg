<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2419"/>
      <stop offset="100%" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c453"/>
      <stop offset="100%" stop-color="#e0982f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- door with keycard reader -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="150" height="230" rx="10" fill="#1e4a33" stroke="#3f7f5c" stroke-width="3"/>
    <circle cx="120" cy="120" r="7" fill="#f6c453"/>
    <rect x="30" y="60" width="90" height="40" rx="6" fill="#0f2419" stroke="#5fae82" stroke-width="2"/>
    <circle cx="45" cy="80" r="5" fill="#4ade80"/>
    <text x="60" y="85" font-family="Arial, sans-serif" font-size="14" fill="#dff5e8">VALID</text>
  </g>

  <!-- glowing key still active -->
  <g transform="translate(300,150)">
    <circle cx="0" cy="0" r="60" fill="#f6c453" opacity="0.12"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#keyGrad)" stroke-width="10"/>
    <rect x="26" y="-6" width="60" height="12" rx="4" fill="url(#keyGrad)"/>
    <rect x="80" y="-14" width="10" height="16" fill="url(#keyGrad)"/>
    <rect x="96" y="-14" width="10" height="20" fill="url(#keyGrad)"/>
  </g>

  <!-- clock representing the time gap -->
  <g transform="translate(560,180)">
    <circle cx="0" cy="0" r="90" fill="#0f2419" stroke="#5fae82" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#dff5e8" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="45" y2="20" stroke="#f6c453" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#dff5e8"/>
    <!-- gap arc highlighting delay -->
    <path d="M 0 -55 A 55 55 0 0 1 45 20" fill="none" stroke="#e0982f" stroke-width="4" stroke-dasharray="4 6"/>
  </g>

  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#dff5e8" font-weight="bold">Offboarding day, access revoked a step too slow</text>
</svg>
