<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apple礼品卡充值余额支付AI订阅，退款只能回到余额、无法提现或转银行卡示意图">
  <defs>
    <linearGradient id="bgGradGc" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14201d"/>
      <stop offset="1" stop-color="#1a2a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradGc)"/>

  <!-- left: gift card feeding into balance -->
  <g transform="translate(150,150)">
    <rect x="-78" y="-46" width="156" height="92" rx="14" fill="#2a2038" stroke="#c98be0" stroke-width="3"/>
    <circle cx="-78" cy="0" r="10" fill="#14201d"/>
    <circle cx="78" cy="0" r="10" fill="#14201d"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#e6c4f7">礼品卡</text>
  </g>
  <text x="150" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">充值进Apple ID余额</text>

  <!-- center: walled garden with lock -->
  <g transform="translate(410,150)">
    <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#20342f" stroke="#4fae8a" stroke-width="3"/>
    <g transform="translate(0,-6)">
      <rect x="-26" y="-6" width="52" height="42" rx="8" fill="#14201d" stroke="#7be8b8" stroke-width="3"/>
      <path d="M-16 -6 L-16 -26 A16 16 0 0 1 16 -26 L16 -6" fill="none" stroke="#7be8b8" stroke-width="5"/>
      <circle cx="0" cy="16" r="5" fill="#7be8b8"/>
    </g>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#9fe6c4">生态内余额</text>
  </g>
  <text x="410" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">只能在苹果生态内消费</text>

  <!-- right: bank card blocked -->
  <g transform="translate(650,150)">
    <rect x="-70" y="-44" width="140" height="88" rx="12" fill="#20342f" stroke="#f2d18a" stroke-width="3" opacity="0.55"/>
    <rect x="-70" y="-24" width="140" height="18" fill="#14201d" opacity="0.6"/>
    <line x1="-58" y1="52" x2="58" y2="-52" stroke="#e0654f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="650" y="290" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">退款到不了银行卡</text>

  <!-- arrows -->
  <g stroke="#4fae8a" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.5">
    <path d="M250 150 L318 150"/>
    <path d="M502 150 L560 150"/>
  </g>

  <text x="60" y="60" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#eef2fb">退款只回原支付方式，余额锁在生态里</text>
  <text x="736" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI服务指南</text>
</svg>
