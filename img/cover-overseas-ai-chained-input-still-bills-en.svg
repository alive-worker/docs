<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="A short line on a long chain. Prior input still bills.">
  <rect width="800" height="400" fill="#101612"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Chained. The input bill stays long.</text>
  <text x="760" y="44" text-anchor="end" fill="#7dcea0" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">AI Access Guide</text>
  <text x="56" y="130" fill="#8fd6b6" font-family="Consolas, Segoe UI, monospace" font-size="20">the earlier turns are still in messages</text>
  <text x="56" y="172" fill="#8fd6b6" font-family="Consolas, Segoe UI, monospace" font-size="20">prior input, still billed this turn</text>
  <text x="56" y="214" fill="#8fd6b6" font-family="Consolas, Segoe UI, monospace" font-size="20">store keeps the object, not the meter</text>
  <text x="56" y="268" fill="#f2d18a" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">continue</text>
  <text x="230" y="268" fill="#c4b59a" font-family="Segoe UI, sans-serif" font-size="18">only the new line</text>
  <text x="40" y="348" fill="#b7c6b8" font-family="Segoe UI, sans-serif" font-size="16">The new words are not the bill. Prior input still bills.</text>
</svg>
