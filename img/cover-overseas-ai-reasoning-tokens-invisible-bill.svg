  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b7b4d4">AI服务指南</text>
  <path d="M0 168 H800" fill="none" stroke="#6d7ea8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="158" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#9aa6c8">屏幕</text>
  <rect x="250" y="96" width="300" height="52" rx="26" fill="#2a3148" stroke="#c9d2ee" stroke-width="2"/>
