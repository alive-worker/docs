<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="按 token 不调用不计费，专属部署运行中仍按小时扣">
  <rect width="800" height="400" fill="#12160f"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">接口停了，部署这条还在走</text>
  <text x="760" y="44" text-anchor="end" fill="#b7c9a4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI服务指南</text>
  <text x="40" y="130" fill="#8fd6b6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">按 token</text>
  <rect x="160" y="110" width="180" height="28" rx="6" fill="#1c3a2c"/>
  <text x="360" y="130" fill="#8aa080" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">调用为 0 就停</text>
  <text x="40" y="210" fill="#f2d18a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">专属部署</text>
  <rect x="160" y="190" width="560" height="28" rx="6" fill="#e2b15a"/>
  <text x="160" y="262" fill="#d9c39a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">运行中按小时。删 Key 停不了，要下线或退订。</text>
  <text x="40" y="340" fill="#c5d4b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">吞吐预留按购买容量收。默认溢出还会再按 token 计一笔。</text>
</svg>
