<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="虚拟卡注销或过期后，AI订阅退款去向不确定示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2418"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="cardClosed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5f66"/>
      <stop offset="1" stop-color="#34383d"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9634a"/>
      <stop offset="1" stop-color="#a6432f"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa27f"/>
      <stop offset="1" stop-color="#2f7a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- left: closed/expired virtual card -->
  <g transform="translate(70,140)">
    <rect x="0" y="0" width="200" height="120" rx="16" fill="url(#cardClosed)" stroke="#c7ccd1" stroke-opacity="0.4"/>
    <rect x="18" y="20" width="42" height="30" rx="5" fill="#e7e9ec" opacity="0.5"/>
    <text x="18" y="82" font-family="Arial, sans-serif" font-size="16" fill="#eef0f2" opacity="0.9">•••• 4471</text>
    <text x="18" y="102" font-family="Arial, sans-serif" font-size="12" fill="#c7ccd1" opacity="0.85">虚拟卡已注销/过期</text>
    <line x1="10" y1="10" x2="190" y2="110" stroke="#ff9b8a" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="10" x2="10" y2="110" stroke="#ff9b8a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- middle: dashed routing lines splitting to two outcomes, with a question mark -->
  <g transform="translate(300,150)">
    <path d="M0 50 C60 50 60 -30 150 -30" fill="none" stroke="#e8d9a8" stroke-width="3" stroke-dasharray="7 9" opacity="0.85"/>
    <path d="M0 50 C60 50 60 130 150 130" fill="none" stroke="#e8d9a8" stroke-width="3" stroke-dasharray="7 9" opacity="0.85"/>
    <path d="M143 -37 L157 -30 L143 -23 Z" fill="#e8d9a8" opacity="0.9"/>
    <path d="M143 123 L157 130 L143 137 Z" fill="#e8d9a8" opacity="0.9"/>
    <circle cx="55" cy="50" r="26" fill="#0f2418" stroke="#f1e6c2" stroke-width="2.5"/>
    <text x="55" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f1e6c2">?</text>
  </g>

  <!-- right top: merchant rejection box -->
  <g transform="translate(500,60)">
    <rect x="0" y="0" width="230" height="95" rx="16" fill="url(#boxA)" stroke="#ffd6c9" stroke-opacity="0.4"/>
    <text x="18" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff2ee">拒收退回商户</text>
    <text x="18" y="58" font-family="Arial, sans-serif" font-size="12" fill="#ffe3db" opacity="0.9">Rejected back to merchant</text>
    <text x="18" y="78" font-family="Arial, sans-serif" font-size="12" fill="#ffe3db" opacity="0.75">发卡行拒收失效卡账户</text>
  </g>

  <!-- right bottom: account credit box -->
  <g transform="translate(500,205)">
    <rect x="0" y="0" width="230" height="95" rx="16" fill="url(#boxB)" stroke="#c9f0dd" stroke-opacity="0.4"/>
    <text x="18" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#eefaf3">记入账户余额</text>
    <text x="18" y="58" font-family="Arial, sans-serif" font-size="12" fill="#dcf5e8" opacity="0.9">Credited to account balance</text>
    <text x="18" y="78" font-family="Arial, sans-serif" font-size="12" fill="#dcf5e8" opacity="0.75">账户仍在，只是卡号变了</text>
  </g>

  <text x="400" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">虚拟卡注销后，退款到底去哪了</text>
  <text x="400" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cfe6da" opacity="0.85">Refund Routing Depends on the Virtual Card Provider, Not the Merchant</text>
</svg>
