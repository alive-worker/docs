<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅暂停按钮背后计费与数据机制封面图">
  <defs>
    <linearGradient id="bgPnc" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1f2e"/>
      <stop offset="1" stop-color="#0f2f3d"/>
    </linearGradient>
    <radialGradient id="glowPnc" cx="400" cy="130" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgPnc)"/>
  <rect width="800" height="400" fill="url(#glowPnc)"/>
  <g fill="#38bdf8" opacity="0.3">
    <circle cx="60" cy="70" r="2.5"/><circle cx="130" cy="140" r="2"/><circle cx="90" cy="230" r="2"/>
    <circle cx="720" cy="80" r="2.5"/><circle cx="670" cy="150" r="2"/><circle cx="740" cy="240" r="2"/>
  </g>

  <!-- left: big pause icon inside a ring -->
  <g transform="translate(210,150)">
    <circle r="82" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.55"/>
    <circle r="82" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 10" opacity="0.35"/>
    <rect x="-30" y="-34" width="18" height="68" rx="5" fill="#7dd3fc"/>
    <rect x="12" y="-34" width="18" height="68" rx="5" fill="#7dd3fc"/>
  </g>

  <!-- right: frozen clock, hands stopped, icicle ticks -->
  <g transform="translate(560,150)">
    <circle r="78" fill="#0f2f3d" stroke="#5eead4" stroke-width="3"/>
    <g stroke="#5eead4" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-46"/>
      <line x1="0" y1="58" x2="0" y2="46"/>
      <line x1="-58" y1="0" x2="-46" y2="0"/>
      <line x1="58" y1="0" x2="46" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="14" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#e0f2fe"/>
    <path d="M-14 74 q4 16 -2 26 M4 78 q4 14 -2 24 M20 70 q4 14 -2 22" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- connecting stalled progress bar -->
  <g transform="translate(400,270)">
    <rect x="-190" y="-8" width="380" height="16" rx="8" fill="#0f2f3d" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-190" y="-8" width="150" height="16" rx="8" fill="#38bdf8" opacity="0.6"/>
    <circle cx="-40" cy="0" r="9" fill="#fbbf24" stroke="#0b1f2e" stroke-width="2"/>
  </g>

  <rect x="205" y="322" width="390" height="46" rx="23" fill="#0f2f3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#e0f2fe">暂停≠取消，时钟没停你可能不知道</text>
</svg>
