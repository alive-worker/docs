<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 订阅账单货币不匹配 DCC 陷阱封面图">
  <defs>
    <linearGradient id="bgGradCur" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f0a26"/>
      <stop offset="1" stop-color="#3a1042"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradCur)"/>
  <g stroke="#4a1552" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <text x="400" y="56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#f0abfc">账单标价美元 却按欧元扣款</text>

  <!-- balance scale, symmetric -->
  <g transform="translate(400,190)">
    <rect x="-4" y="-70" width="8" height="120" rx="4" fill="#6b1f63"/>
    <circle cx="0" cy="-70" r="10" fill="#e879f9"/>
    <line x1="-150" y1="-40" x2="150" y2="-40" stroke="#e879f9" stroke-width="4"/>

    <line x1="-150" y1="-40" x2="-150" y2="10" stroke="#e879f9" stroke-width="2"/>
    <path d="M-190 10 a40 24 0 0 0 80 0 z" fill="#3a1042" stroke="#6b1f63" stroke-width="2"/>
    <text x="-150" y="4" text-anchor="middle" font-size="30" font-weight="700" fill="#a78bfa">$</text>
    <text x="-150" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e879f9">账单计价</text>

    <line x1="150" y1="-40" x2="150" y2="26" stroke="#f87171" stroke-width="2"/>
    <path d="M104 26 a46 26 0 0 0 92 0 z" fill="#3a1414" stroke="#f87171" stroke-width="2.5"/>
    <text x="150" y="20" text-anchor="middle" font-size="30" font-weight="700" fill="#f87171">€</text>
    <text x="150" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#fca5a5">实际扣款</text>

    <rect x="-40" y="70" width="80" height="30" rx="6" fill="#3a1042" stroke="#e879f9" stroke-width="2"/>
    <text x="0" y="91" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f0abfc">失衡</text>
  </g>

  <text x="400" y="350" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e879f9" opacity="0.9">动态货币转换 · 汇率加点 · 结账前锁定计价货币</text>
</svg>
