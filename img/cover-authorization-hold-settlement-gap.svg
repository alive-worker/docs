<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2418"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5a4a"/>
      <stop offset="1" stop-color="#2a4436"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#a6822f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- left: frozen/pending hold card -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="230" height="150" rx="16" fill="url(#cardA)" stroke="#7fd6b0" stroke-opacity="0.35"/>
    <rect x="18" y="26" width="70" height="16" rx="4" fill="#e8f5ee" opacity="0.55"/>
    <circle cx="190" cy="34" r="16" fill="#e8f5ee" opacity="0.2"/>
    <text x="18" y="82" font-family="Arial, sans-serif" font-size="15" fill="#dff2e7" opacity="0.85">待处理 / Pending</text>
    <text x="18" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">$19.99</text>
    <!-- ice/freeze marks to signal hold -->
    <g stroke="#9fe3c8" stroke-width="2" opacity="0.6">
      <line x1="18" y1="128" x2="30" y2="128"/>
      <line x1="34" y1="128" x2="46" y2="128"/>
      <line x1="50" y1="128" x2="62" y2="128"/>
    </g>
    <path d="M195 118 l7 7 m0 -7 l-7 7 M198 110 v22" stroke="#bfe9d6" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- right: posted settlement card -->
  <g transform="translate(480,110)">
    <rect x="0" y="0" width="230" height="150" rx="16" fill="url(#cardB)" stroke="#ffe1a3" stroke-opacity="0.4"/>
    <rect x="18" y="26" width="70" height="16" rx="4" fill="#fff7e6" opacity="0.6"/>
    <circle cx="190" cy="34" r="16" fill="#fff7e6" opacity="0.25"/>
    <text x="18" y="82" font-family="Arial, sans-serif" font-size="15" fill="#3a2c0c" opacity="0.85">已入账 / Posted</text>
    <text x="18" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2a1e05">$18.40</text>
    <path d="M186 122 l8 8 16 -18" stroke="#2a1e05" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>

  <!-- time gap arrow between the two cards -->
  <g transform="translate(330,175)">
    <line x1="0" y1="10" x2="140" y2="10" stroke="#e8d9a8" stroke-width="3" stroke-dasharray="6 8" opacity="0.8"/>
    <path d="M132 3 L146 10 L132 17 Z" fill="#e8d9a8" opacity="0.85"/>
    <text x="70" y="-14" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f1e6c2" opacity="0.9">时间差 · Time Gap</text>
  </g>

  <!-- clock icon above the gap -->
  <g transform="translate(378,110)">
    <circle cx="22" cy="22" r="22" fill="none" stroke="#f1e6c2" stroke-width="3" opacity="0.85"/>
    <line x1="22" y1="22" x2="22" y2="10" stroke="#f1e6c2" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="31" y2="27" stroke="#f1e6c2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- headline text -->
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">预授权 → 结算：两阶段扣款机制</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cfe6da" opacity="0.85">Authorization Hold vs Settlement — Why the Amounts Differ</text>
</svg>
