<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Framework for evaluating whether an AI tool subscription is worth paying for">
  <defs>
    <linearGradient id="bgEvale" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0d3830"/>
    </linearGradient>
    <pattern id="hatchEvale" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#134e42" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bgEvale)"/>
  <rect width="800" height="400" fill="url(#hatchEvale)"/>

  <text x="400" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#ecfdf5">Is This AI Tool Worth Paying For?</text>
  <text x="400" y="76" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5eead4" opacity="0.9">A reusable subscription evaluation framework</text>

  <g transform="translate(220,104)" font-family="Arial,Helvetica,sans-serif">
    <rect x="0" y="0" width="360" height="238" rx="14" fill="#0d3830" stroke="#14b8a6" stroke-width="2"/>
    <g transform="translate(24,32)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="14" fill="#ecfdf5">Frequent enough usage</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="66" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <g transform="translate(24,74)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="14" fill="#ecfdf5">Replaces manual work hours</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="52" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <g transform="translate(24,116)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#5eead4" stroke-width="2.5" opacity="0.6"/>
      <text x="30" y="5" font-size="14" fill="#ecfdf5" opacity="0.85">No good free alternative</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="30" height="16" rx="8" fill="#5eead4" opacity="0.7"/>
    </g>
    <g transform="translate(24,158)">
      <circle cx="10" cy="0" r="10" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M5 0 l4 4 l7 -8" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="30" y="5" font-size="14" fill="#ecfdf5">Renewal cost is transparent</text>
      <rect x="228" y="-8" width="78" height="16" rx="8" fill="#134e42"/>
      <rect x="228" y="-8" width="58" height="16" rx="8" fill="#2dd4bf"/>
    </g>
    <line x1="24" y1="188" x2="336" y2="188" stroke="#134e42" stroke-width="1.5"/>
    <text x="24" y="216" font-size="13.5" fill="#5eead4" font-weight="700">Overall score</text>
    <text x="336" y="216" text-anchor="end" font-size="19" fill="#2dd4bf" font-weight="700">8.5 / 10</text>
  </g>
  <text x="400" y="378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5eead4" opacity="0.85">Four dimensions for a rational subscription call</text>
</svg>
