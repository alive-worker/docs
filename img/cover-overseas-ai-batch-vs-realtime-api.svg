<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实时接口贵、批量接口半价，同一模型两条通道">
  <rect width="800" height="400" fill="#12161c"/>
  <text x="40" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">同一模型，两条完全不同的时钟</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9bb0c4">AI服务指南</text>
  <rect x="56" y="100" width="86" height="210" rx="10" fill="#2a2214" stroke="#e2b15a" stroke-width="2.5"/>
  <text x="99" y="168" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">实时</text>
  <text x="99" y="198" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#e6d3b0">全价</text>
  <text x="99" y="268" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#e6d3b0">此刻</text>
  <rect x="190" y="246" width="540" height="64" rx="10" fill="#173a2c" stroke="#7be8b8" stroke-width="2.5"/>
  <text x="214" y="274" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">批量</text>
  <text x="214" y="298" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#cfe8dc">约半价，窗口可以拉到 24 小时</text>
  <text x="700" y="286" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#cfe8dc">24h</text>
  <text x="190" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#b7c6d4">买的是等待，不是另一个模型。过期只收已经完成的请求。</text>
</svg>