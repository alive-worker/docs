<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- left panel: AI platform, shows canceled -->
  <rect x="60" y="90" width="280" height="220" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#8fd3c8" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" fill="#e8f6f1" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI 平台</text>
  <circle cx="200" cy="200" r="42" fill="none" stroke="#4ade80" stroke-width="6"/>
  <path d="M180 200 l14 14 l28 -32" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="270" text-anchor="middle" fill="#bfe9d8" font-family="Arial, sans-serif" font-size="18">已取消</text>

  <!-- broken link in middle -->
  <g stroke="#f2c94c" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M340 175 l40 -15"/>
    <path d="M420 240 l40 15"/>
  </g>
  <circle cx="400" cy="200" r="10" fill="#f2c94c"/>
  <text x="400" y="150" text-anchor="middle" fill="#f2c94c" font-family="Arial, sans-serif" font-size="16" font-weight="700">两套独立系统</text>

  <!-- right panel: PayPal, shows still active -->
  <rect x="460" y="90" width="280" height="220" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#7fb2ff" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" fill="#e8f0ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">PayPal 账户</text>
  <circle cx="600" cy="200" r="42" fill="none" stroke="#ff6b6b" stroke-width="6"/>
  <circle cx="600" cy="200" r="16" fill="#ff6b6b"/>
  <text x="600" y="270" text-anchor="middle" fill="#ffd8d8" font-family="Arial, sans-serif" font-size="18">仍活跃</text>

  <text x="400" y="360" text-anchor="middle" fill="#dbe7ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">取消订阅 ≠ 终止 PayPal 自动付款协议</text>
</svg>
