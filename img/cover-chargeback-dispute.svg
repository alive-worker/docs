<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="申请拒付前的三步正确顺序封面图">
  <defs>
    <linearGradient id="bgGradCb" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#052018"/>
      <stop offset="1" stop-color="#0a3d2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradCb)"/>

  <text x="52" y="70" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#6ee7b7">申请拒付前</text>
  <text x="52" y="106" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#34d399">先按顺序走完这三步</text>

  <rect x="640" y="40" width="120" height="34" rx="6" fill="#0a3d2c" stroke="#34d399" stroke-width="2"/>
  <text x="700" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">正确顺序</text>

  <!-- horizontal 3-step timeline -->
  <line x1="120" y1="260" x2="680" y2="260" stroke="#0f5c40" stroke-width="4"/>

  <g transform="translate(160,260)">
    <circle r="34" fill="#0a3d2c" stroke="#34d399" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#6ee7b7">1</text>
    <text y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#a7f3d0">先联系商家</text>
    <text y="84" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6ee7b7">要求退款或说明</text>
  </g>

  <g transform="translate(400,260)">
    <circle r="34" fill="#0a3d2c" stroke="#34d399" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#6ee7b7">2</text>
    <text y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#a7f3d0">保留沟通证据</text>
    <text y="84" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6ee7b7">截图/邮件/工单号</text>
  </g>

  <g transform="translate(640,260)">
    <circle r="34" fill="#0a3d2c" stroke="#f59e0b" stroke-width="3.5"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#fcd34d">3</text>
    <text y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fde68a">再向发卡行申请拒付</text>
    <text y="84" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#fcd34d">最后手段</text>
  </g>

  <path d="M194 260 h172" stroke="#34d399" stroke-width="0" />
  <text x="400" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#34d399" opacity="0.85">顺序错了容易被判恶意拒付 · 影响账户信誉</text>
</svg>
