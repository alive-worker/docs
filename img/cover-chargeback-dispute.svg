<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 订阅扣款拒付纠纷处理顺序封面图">
  <defs>
    <linearGradient id="bgGradCbd" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0e3a34"/>
    </linearGradient>
    <radialGradient id="glowCbd" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradCbd)"/>
  <rect width="800" height="400" fill="url(#glowCbd)"/>
  <g stroke="#1e5b50" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5eead4" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">扣款有异议</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">拒付先看顺序</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">客服申诉 · 证据留存 · 拒付流程</text>

  <!-- card with dispute stamp -->
  <g transform="translate(610,175)">
    <circle r="88" fill="#0f2c26" stroke="#1e5b50" stroke-width="2"/>
    <rect x="-40" y="-26" width="80" height="52" rx="8" fill="#123832" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="-40" y="-14" width="80" height="10" fill="#2dd4bf" opacity="0.35"/>
    <rect x="-30" y="8" width="34" height="6" rx="3" fill="#5eead4" opacity="0.6"/>
    <g transform="translate(6,-52)">
      <rect x="-34" y="-12" width="68" height="24" rx="4" fill="#3a1414" stroke="#f87171" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#f87171">拒付</text>
    </g>
    <text x="0" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5eead4">扣款争议处理</text>
  </g>

  <!-- step order row: 1 contact  2 evidence  3 dispute -->
  <g>
    <circle cx="330" cy="300" r="20" fill="#0f2c26" stroke="#2dd4bf" stroke-width="2"/>
    <text x="330" y="306" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#2dd4bf">1</text>
    <path d="M354 300 h32" stroke="#1e5b50" stroke-width="2"/>
    <circle cx="410" cy="300" r="20" fill="#0f2c26" stroke="#1e5b50" stroke-width="2" opacity="0.7"/>
    <text x="410" y="306" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#5eead4" opacity="0.8">2</text>
    <path d="M434 300 h32" stroke="#1e5b50" stroke-width="2"/>
    <circle cx="490" cy="300" r="20" fill="#0f2c26" stroke="#1e5b50" stroke-width="2" opacity="0.5"/>
    <text x="490" y="306" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#5eead4" opacity="0.6">3</text>
  </g>
</svg>
