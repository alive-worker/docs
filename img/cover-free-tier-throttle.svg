<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI免费额度动态限流缩水封面图">
  <defs>
    <linearGradient id="bgGradThrottle" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c0f2e"/>
      <stop offset="1" stop-color="#33184f"/>
    </linearGradient>
    <radialGradient id="glowThrottle" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#522c7a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#522c7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradThrottle)"/>
  <rect width="800" height="400" fill="url(#glowThrottle)"/>
  <g stroke="#180c26" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#c084fc" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#d8b4fe">免费额度悄悄</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#522c7a">说降就降</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#c084fc"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#c084fc" opacity="0.85">动态限流 · 算力调度 · 不提前通知</text>

  <!-- the actual mechanism: a bar meter of daily quota shrinking bar by bar, with a live-load dial -->
  <g transform="translate(600,140)">
    <rect x="-104" y="-70" width="208" height="140" rx="16" fill="#33184f" stroke="#180c26" stroke-width="2"/>
    <text x="-84" y="-42" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#c084fc" opacity="0.85">今日剩余额度</text>
    <g>
      <rect x="-84" y="-24" width="20" height="60" rx="3" fill="#c084fc" opacity="0.85"/>
      <rect x="-52" y="-8" width="20" height="44" rx="3" fill="#c084fc" opacity="0.6"/>
      <rect x="-20" y="10" width="20" height="26" rx="3" fill="#f87171" opacity="0.85"/>
      <rect x="12" y="20" width="20" height="16" rx="3" fill="#f87171" opacity="0.6"/>
      <rect x="44" y="26" width="20" height="10" rx="3" fill="#f87171" opacity="0.4"/>
    </g>
    <path d="M-88 -30 L70 32" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"/>
  </g>
  <g stroke="#c084fc" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M600 220 v34" stroke-dasharray="4 4"/>
    <path d="M592 246 l8 10 l8 -10" fill="none"/>
  </g>
  <g transform="translate(600,300)">
    <rect x="-84" y="-24" width="168" height="48" rx="8" fill="#33184f" stroke="#f87171" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f87171" font-weight="700">已达当日上限</text>
  </g>
  <text x="600" y="355" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#c084fc" opacity="0.85">配额引擎 · 实时重算</text>
</svg>
