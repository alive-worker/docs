<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI免费额度被限速节流封面图">
  <defs>
    <linearGradient id="bgFt" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062226"/>
      <stop offset="1" stop-color="#0a3a40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgFt)"/>

  <!-- centered gauge -->
  <g transform="translate(400,190)">
    <path d="M-140 20 A140 140 0 0 1 140 20" fill="none" stroke="#0e4b52" stroke-width="22"/>
    <path d="M-140 20 A140 140 0 0 1 -40 -128" fill="none" stroke="#22d3ee" stroke-width="22"/>
    <path d="M-40 -128 A140 140 0 0 1 60 -122" fill="none" stroke="#fbbf24" stroke-width="22"/>
    <path d="M60 -122 A140 140 0 0 1 140 20" fill="none" stroke="#f87171" stroke-width="22"/>
    <g transform="rotate(70)">
      <line x1="0" y1="0" x2="0" y2="-118" stroke="#ecfeff" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="12" fill="#ecfeff"/>
    <text x="0" y="70" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#67e8f9">当前速率</text>
  </g>

  <text x="60" y="70" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#ecfeff">免费额度，突然变慢了</text>
  <text x="60" y="100" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#67e8f9" opacity="0.9">限速节流 · 隐藏阈值 · 高峰降级</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="330" font-size="15" fill="#f87171" font-weight="700">限速中</text>
    <text x="720" y="330" text-anchor="end" font-size="15" fill="#22d3ee" font-weight="700">正常速率</text>
  </g>
  <text x="400" y="370" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#67e8f9" opacity="0.85">你以为的"免费"，其实有隐藏天花板</text>
</svg>
