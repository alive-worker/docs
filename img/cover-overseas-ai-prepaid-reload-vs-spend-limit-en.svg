<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="A monthly reload cap does not stop spending credits already on the account.">
  <rect width="800" height="400" fill="#14110e"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">The cap did not stop this</text>
  <text x="760" y="44" text-anchor="end" fill="#d4c4a8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI Access Guide</text>
  <text x="40" y="150" fill="#c4a27a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Balance</text>
  <text x="40" y="210" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="48" font-weight="700">Still falling</text>
  <rect x="500" y="128" width="260" height="100" rx="16" fill="#241812" stroke="#5a4030" stroke-width="2"/>
  <circle cx="548" cy="178" r="20" fill="#3a2a22" stroke="#e2b15a" stroke-width="3"/>
  <circle cx="540" cy="178" r="7" fill="#e2b15a"/>
  <text x="584" y="172" fill="#f2d18a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">Hard limit</text>
  <text x="584" y="198" fill="#c4a27a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">Switch off</text>
  <text x="40" y="300" fill="#d9c39a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">The reload cap only limits automatic buys. Held credits still spend.</text>
  <text x="40" y="340" fill="#a89078" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">An alert does not stop traffic. Read error.code.</text>
</svg>
