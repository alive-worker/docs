<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Idle storage still bills; search adds a call and input">
  <rect width="800" height="400" fill="#141820"/>
  <text x="48" y="52" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#f4f0ea">Nobody Searched. The Store Still Bills.</text>
  <g transform="translate(48,100)">
    <rect width="330" height="200" rx="14" fill="#1c2430" stroke="#8eb4d4" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#d5e2f2">Zero queries</text>
    <text x="165" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" fill="#b7c6d8">Parsed chunks + embeddings</text>
    <text x="165" y="118" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" fill="#b7c6d8">1 GB free, all stores</text>
    <text x="165" y="164" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#d5e2f2">Overflow bills daily</text>
  </g>
  <g transform="translate(422,100)">
    <rect width="330" height="200" rx="14" fill="#2a2218" stroke="#e2b15a" stroke-width="2.5"/>
    <text x="165" y="42" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">One search</text>
    <text x="165" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" fill="#e6d3b0">file_search_call is extra</text>
