  <text x="48" y="348" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#cbbfa8">Expiry deletes the index | posted days stay | calls are Responses</text>
  <text x="752" y="34" text-anchor="end" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#cbbfa8" opacity="0.85">AI Access Guide</text>
