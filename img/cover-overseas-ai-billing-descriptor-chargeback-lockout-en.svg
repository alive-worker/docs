<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A credit card statement line with an unfamiliar merchant name and a question mark">
  <defs>
    <linearGradient id="bgGradDescEn" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161b24"/>
      <stop offset="1" stop-color="#221c2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradDescEn)"/>

  <!-- credit card -->
  <g transform="translate(140,150)">
    <rect x="-90" y="-56" width="180" height="112" rx="14" fill="#2a2540" stroke="#7d6fd9" stroke-width="3"/>
    <rect x="-90" y="-28" width="180" height="18" fill="#4a3f78"/>
    <circle cx="-52" cy="30" r="10" fill="#f2c96b"/>
    <circle cx="-30" cy="30" r="10" fill="#f2c96b" opacity="0.7"/>
    <text x="0" y="72" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#b9aef0">CREDIT CARD</text>
  </g>

  <!-- statement panel -->
  <g transform="translate(430,80)">
    <rect x="-30" y="0" width="360" height="240" rx="10" fill="#1c2230" stroke="#3a4258" stroke-width="2"/>
    <text x="0" y="34" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#dfe5f0">Transactions</text>
    <line x1="-10" y1="48" x2="310" y2="48" stroke="#3a4258" stroke-width="1"/>
    <text x="-10" y="76" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9aa4bd">09/03  GROCERY STORE</text>
    <text x="-10" y="106" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9aa4bd">09/05  TRANSIT RELOAD</text>
    <g>
      <rect x="-16" y="122" width="326" height="40" rx="6" fill="#3a2540" stroke="#e8845a" stroke-width="2"/>
      <text x="-10" y="148" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#f3b48c">09/07  PMT*XZ7719 STRLNG</text>
    </g>
    <text x="-10" y="196" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9aa4bd">09/08  UTILITY BILL</text>
  </g>

  <!-- question mark bubble -->
  <g transform="translate(700,142)">
    <circle r="34" fill="#e8845a"/>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="800" fill="#1c1420">?</text>
  </g>

  <!-- caption -->
  <text x="400" y="352" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#dfe5f0">Unfamiliar name on statement? Check records before disputing</text>
</svg>
