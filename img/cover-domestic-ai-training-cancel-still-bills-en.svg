<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cancel bills tokens used. Other stops do not.">

  <rect width="800" height="400" fill="#14110c"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f4f0ea">Cancel stops the rest. Used tokens stay.</text>
  <text x="760" y="42" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#cbbfa8">AI Access Guide</text>
  <text x="40" y="118" font-family="Segoe UI, sans-serif" font-size="15" fill="#e6d3b0">Training run</text>
  <rect x="40" y="136" width="720" height="46" rx="10" fill="#241c14" stroke="#5a4a32" stroke-width="2"/>
  <rect x="40" y="136" width="430" height="46" rx="10" fill="#3a2c16" stroke="#e2b15a" stroke-width="2"/>
  <text x="255" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f2d18a">Tokens used, still billed</text>
  <text x="590" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#8d7d68">Not run</text>
  <text x="40" y="230" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f2d18a">You canceled: usage is only this slice</text>
  <text x="40" y="268" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#b7d0c4">Any other stop: no training fee</text>
  <text x="40" y="330" font-family="Segoe UI, sans-serif" font-size="16" fill="#cbbfa8">A finished train is not callable. Deploy billing starts at running.</text>

</svg>
