<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="共享订阅计划支付失败连累所有成员封面图">
  <defs>
    <linearGradient id="bgSpf" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a0a20"/>
      <stop offset="1" stop-color="#40123a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgSpf)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#fce7f3">一人扣款失败，全员断服</text>
  <text x="400" y="72" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#f9a8d4" opacity="0.9">共享订阅计划的单点故障</text>

  <!-- radial hub-and-spoke, center cracked, 4 satellites failing red -->
  <g transform="translate(400,240)">
    <line x1="0" y1="0" x2="-150" y2="-70" stroke="#ec4899" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="150" y2="-70" stroke="#ec4899" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-150" y2="70" stroke="#ec4899" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="150" y2="70" stroke="#ec4899" stroke-width="2.5" opacity="0.7"/>

    <circle r="34" fill="#40123a" stroke="#f472b6" stroke-width="3"/>
    <path d="M-10 -14 l6 10 l-6 4 l10 14" stroke="#fbcfe8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(-150,-70)">
      <circle r="24" fill="#3a0d15" stroke="#f87171" stroke-width="2.5"/>
      <circle cy="-6" r="8" fill="#fca5a5"/>
      <path d="M-12 14 a12 10 0 0 1 24 0" fill="#fca5a5"/>
    </g>
    <g transform="translate(150,-70)">
      <circle r="24" fill="#3a0d15" stroke="#f87171" stroke-width="2.5"/>
      <circle cy="-6" r="8" fill="#fca5a5"/>
      <path d="M-12 14 a12 10 0 0 1 24 0" fill="#fca5a5"/>
    </g>
    <g transform="translate(-150,70)">
      <circle r="24" fill="#3a0d15" stroke="#f87171" stroke-width="2.5"/>
      <circle cy="-6" r="8" fill="#fca5a5"/>
      <path d="M-12 14 a12 10 0 0 1 24 0" fill="#fca5a5"/>
    </g>
    <g transform="translate(150,70)">
      <circle r="24" fill="#3a0d15" stroke="#f87171" stroke-width="2.5"/>
      <circle cy="-6" r="8" fill="#fca5a5"/>
      <path d="M-12 14 a12 10 0 0 1 24 0" fill="#fca5a5"/>
    </g>
  </g>

  <text x="400" y="374" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f9a8d4" opacity="0.85">分摊付款人卡片失效，整组账号一起掉线</text>
</svg>
