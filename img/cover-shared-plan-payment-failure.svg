<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="合租AI订阅房主付款卡失效全员掉线封面图">
  <defs>
    <linearGradient id="bgGradShare" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#132c54"/>
    </linearGradient>
    <radialGradient id="glowShare" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25497a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#25497a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradShare)"/>
  <rect width="800" height="400" fill="url(#glowShare)"/>
  <g stroke="#081222" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5b8def" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#a3c2fb">合租的AI订阅</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#25497a">房主一张卡，全员掉线</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5b8def"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5b8def" opacity="0.85">家庭套餐 · 团队订阅 · 付款单点故障</text>

  <!-- one card in center, connected to multiple user nodes -->
  <g transform="translate(600,150)">
    <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#132c54" stroke="#f87171" stroke-width="2.5"/>
    <rect x="-45" y="-12" width="90" height="10" fill="#f87171" opacity="0.5"/>
    <rect x="-32" y="8" width="36" height="6" rx="2" fill="#5b8def" opacity="0.6"/>
    <text x="0" y="-40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f87171" font-weight="700">卡失效</text>
  </g>
  <g stroke="#081222" stroke-width="2" fill="none" opacity="0.7">
    <path d="M555 150 L470 230"/>
    <path d="M600 180 L600 260"/>
    <path d="M645 150 L730 230"/>
  </g>
  <g fill="#132c54" stroke="#5b8def" stroke-width="2">
    <circle cx="460" cy="248" r="26"/>
    <circle cx="600" cy="278" r="26"/>
    <circle cx="740" cy="248" r="26"/>
  </g>
  <g fill="#5b8def">
    <circle cx="460" cy="240" r="8"/>
    <path d="M446 262 q14 -16 28 0 z"/>
    <circle cx="600" cy="270" r="8"/>
    <path d="M586 292 q14 -16 28 0 z"/>
    <circle cx="740" cy="240" r="8"/>
    <path d="M726 262 q14 -16 28 0 z"/>
  </g>
  <text x="600" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5b8def">全体成员同步掉线</text>
</svg>
