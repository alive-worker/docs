<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team seat removal that doesn't update billing right away">
  <defs>
    <linearGradient id="bgSrle" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062318"/>
      <stop offset="1" stop-color="#0b3d27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgSrle)"/>

  <text x="60" y="58" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#dcfce7">You Removed the Seat.</text>
  <text x="60" y="88" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#4ade80">The Bill Didn't Notice.</text>

  <g transform="translate(0,220)">
    <g transform="translate(120,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(250,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(400,0)" opacity="0.9">
      <circle r="30" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="5 5"/>
      <circle cy="-8" r="9" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <path d="M-12 -12 l24 24 M12 -12 l-24 24" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(0,58)" opacity="0.85">
        <circle r="12" fill="none" stroke="#fca5a5" stroke-width="2"/>
        <path d="M0 -12 v12 l8 6" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="24" y="5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#fca5a5">Delayed sync</text>
      </g>
    </g>
    <g transform="translate(550,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
    <g transform="translate(680,0)">
      <circle r="26" fill="#0b3d27" stroke="#4ade80" stroke-width="2.5"/>
      <circle cy="-8" r="9" fill="#86efac"/>
      <path d="M-14 16 a14 12 0 0 1 28 0" fill="#86efac"/>
    </g>
  </g>

  <rect x="260" y="330" width="280" height="42" rx="21" fill="#0b3d27" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#fca5a5" font-weight="700">Still billed for that seat</text>
</svg>
