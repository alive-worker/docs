  <!-- Accent dots top right -->
  <circle cx="750" cy="30" r="3" fill="#4a9adf60"/>
  <circle cx="762" cy="30" r="3" fill="#4adf9f60"/>
  <circle cx="774" cy="30" r="3" fill="#df9f4a60"/>
