<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rerankLaser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <circle cx="160" cy="90" r="130" fill="#14b8a6" opacity="0.05"/>
  <circle cx="700" cy="300" r="140" fill="#10b981" opacity="0.04"/>

  <!-- Top Badge -->
  <rect x="40" y="28" width="128" height="26" rx="13" fill="rgba(20, 184, 166, 0.16)"/>
  <text x="104" y="45" fill="#2dd4bf" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">RAG OPTIMIZATION</text>
  <text x="184" y="46" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="13">检索切片精排与Token蒸馏降本拓扑</text>

  <!-- Headline -->
  <text x="40" y="82" fill="#f1f5f9" font-family="-apple-system,sans-serif" font-size="19" font-weight="800">Top-K 粗排切片 90% 沦为账单噪声，通过二阶段重排直降 85% 输入费用</text>

  <!-- Main Pipeline Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="720" height="236" rx="14" fill="#131b26" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
  </g>

  <!-- Section 1: Naive Top-20 Ingestion (Left Funnel) -->
  <g transform="translate(60, 125)">
    <rect x="0" y="0" width="220" height="196" rx="10" fill="#172030" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
    <text x="12" y="24" fill="#f87171" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">1. 无重排：直接塞入 Top-20</text>
    <text x="12" y="42" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5">向量相似度粗排 (Embedding 召回)</text>

    <!-- Chunk Stack -->
    <rect x="12" y="52" width="196" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="67" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600">Chunk #1 (真正相关) ~500 Tokens</text>

    <rect x="12" y="78" width="196" height="20" rx="4" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="0.8"/>
    <text x="20" y="92" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="10">Chunk #2 (部分重叠/噪声) ~500 T</text>

    <rect x="12" y="102" width="196" height="20" rx="4" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="0.8"/>
    <text x="20" y="116" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="10">Chunk #3..#18 (完全偏离主题) ~8,000 T</text>

    <rect x="12" y="126" width="196" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="140" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600">Chunk #19 (迷失在尾部相关块) ~500 T</text>

    <line x1="12" y1="156" x2="208" y2="156" stroke="rgba(255,255,255,0.1)"/>
    <text x="12" y="174" fill="#f87171" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">总输入：10,000 Tokens / 次</text>
    <text x="12" y="190" fill="#fca5a5" font-family="-apple-system,sans-serif" font-size="10">有效率仅 10% · 幻觉诱发严重</text>
  </g>

  <!-- Funnel Connector Arrow -->
  <path d="M 292 225 L 340 225" stroke="#2dd4bf" stroke-width="2.5"/>
  <polygon points="344,225 336,220 336,230" fill="#2dd4bf"/>

  <!-- Section 2: Rerank Sifter (Middle) -->
  <g transform="translate(348, 125)">
    <rect x="0" y="0" width="160" height="196" rx="10" fill="#14212e" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="12" y="24" fill="#2dd4bf" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">2. Cross-Encoder</text>
    <text x="12" y="42" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5">二阶段语义重排 (Reranker)</text>

    <!-- Filter Mechanism Visual -->
    <rect x="12" y="55" width="136" height="80" rx="6" fill="rgba(45, 212, 191, 0.08)" stroke="rgba(45, 212, 191, 0.25)"/>
    <text x="80" y="78" fill="#5eead4" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle">全文交叉注意力</text>
    <text x="80" y="96" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">剔除冗余相似块</text>
    <text x="80" y="114" fill="#f87171" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle">丢弃 17 个无效噪声切片</text>
    <text x="80" y="128" fill="#34d399" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle">仅精炼 Top-3 核心块</text>

    <rect x="12" y="146" width="136" height="38" rx="6" fill="#182736"/>
    <text x="80" y="162" fill="#a7f3d0" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">重排成本：约 $0.0001</text>
    <text x="80" y="177" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="9.5" text-anchor="middle">撬动 85% 大模型算力节省</text>
  </g>

  <!-- Funnel Connector Arrow -->
  <path d="M 518 225 L 560 225" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="564,225 556,220 556,230" fill="#10b981"/>

  <!-- Section 3: Clean Top-3 Ingestion (Right Outlet) -->
  <g transform="translate(568, 125)">
    <rect x="0" y="0" width="172" height="196" rx="10" fill="#122521" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="24" fill="#34d399" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">3. 精排后：高密 Top-3</text>
    <text x="12" y="42" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5">送入大模型生成提示词</text>

    <rect x="12" y="55" width="148" height="26" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981"/>
    <text x="20" y="72" fill="#a7f3d0" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="700">Top 1 切片 (相关度 98%)</text>

    <rect x="12" y="86" width="148" height="26" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981"/>
    <text x="20" y="103" fill="#a7f3d0" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="700">Top 2 切片 (相关度 94%)</text>

    <rect x="12" y="117" width="148" height="26" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981"/>
    <text x="20" y="134" fill="#a7f3d0" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="700">Top 3 切片 (相关度 91%)</text>

    <line x1="12" y1="152" x2="160" y2="152" stroke="rgba(255,255,255,0.1)"/>
    <text x="12" y="170" fill="#34d399" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">总输入：1,500 Tokens</text>
    <text x="12" y="186" fill="#a7f3d0" font-family="-apple-system,sans-serif" font-size="10">有效率 95% · 成本直降 85%</text>
  </g>

  <!-- Bottom Notice Banner -->
  <rect x="40" y="354" width="720" height="26" rx="6" fill="rgba(20, 184, 166, 0.1)" stroke="rgba(20, 184, 166, 0.25)"/>
  <text x="400" y="371" fill="#99f6e4" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">架构启示：单次问答不是切片越多越好，粗排召回 Top-20 结合精排收敛至 Top-3，是兼顾极低幻觉与极低账单的最佳平衡点</text>
</svg>