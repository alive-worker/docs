<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="删除AI账户后订阅仍在扣款封面图">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241a05"/>
      <stop offset="1" stop-color="#4a3608"/>
    </linearGradient>
    <linearGradient id="bgR" x1="400" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a1408"/>
      <stop offset="1" stop-color="#5c1f0e"/>
    </linearGradient>
  </defs>
  <polygon points="0,0 460,0 340,400 0,400" fill="url(#bgL)"/>
  <polygon points="460,0 800,0 800,400 340,400" fill="url(#bgR)"/>
  <line x1="460" y1="0" x2="340" y2="400" stroke="#fb923c" stroke-width="3" opacity="0.8"/>

  <!-- left: account deleted trash bin, large -->
  <g transform="translate(170,168)">
    <path d="M-50 -40 h100 M-38 -40 v-18 h76 v18 M-40 -40 l10 96 h60 l10 -96" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linejoin="round"/>
    <line x1="-16" y1="-24" x2="-12" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
    <line x1="0" y1="-24" x2="0" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
    <line x1="16" y1="-24" x2="12" y2="46" stroke="#fcd34d" stroke-width="4" opacity="0.7"/>
  </g>
  <text x="170" y="286" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fde68a">账户已删除</text>

  <!-- right: recurring dollar sign, large -->
  <g transform="translate(600,168)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#f87171" stroke-width="5"/>
    <text x="0" y="20" text-anchor="middle" font-size="64" font-weight="700" fill="#f87171">$</text>
    <path d="M50 -40 a70 70 0 0 1 12 30" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrowLoop)"/>
  </g>
  <text x="600" y="286" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fca5a5">订阅仍在扣款</text>

  <rect x="0" y="326" width="800" height="74" fill="#170f03"/>
  <text x="400" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#fde68a">删号 ≠ 取消订阅</text>
  <text x="400" y="388" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#fb923c">两套独立系统 · 删前先在计费页取消</text>
</svg>
