<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI subscription billing change after company acquisition cover image">
  <defs>
    <linearGradient id="bgGradAcq" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0e3a34"/>
    </linearGradient>
    <radialGradient id="glowAcq" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowAcq" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradAcq)"/>
  <rect width="800" height="400" fill="url(#glowAcq)"/>
  <g stroke="#1e5b50" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5eead4" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">AI Tool Acquired</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">Billing Merchant Quietly Changes</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">Merger · Merchant Change · Check Before Renewal</text>

  <!-- two buildings merging with arrow -->
  <g transform="translate(610,170)">
    <circle r="88" fill="#0f2c26" stroke="#1e5b50" stroke-width="2"/>
    <g transform="translate(-38,-10)">
      <rect x="-16" y="-38" width="32" height="76" rx="4" fill="#123832" stroke="#5eead4" stroke-width="2"/>
      <rect x="-9" y="-28" width="7" height="7" fill="#5eead4" opacity="0.6"/>
      <rect x="2" y="-28" width="7" height="7" fill="#5eead4" opacity="0.6"/>
      <rect x="-9" y="-14" width="7" height="7" fill="#5eead4" opacity="0.6"/>
      <rect x="2" y="-14" width="7" height="7" fill="#5eead4" opacity="0.6"/>
      <rect x="-9" y="0" width="7" height="7" fill="#5eead4" opacity="0.6"/>
      <rect x="2" y="0" width="7" height="7" fill="#5eead4" opacity="0.6"/>
    </g>
    <path d="M-10 -10 h26" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowAcq)"/>
    <g transform="translate(40,-10)">
      <rect x="-18" y="-46" width="38" height="84" rx="4" fill="#123832" stroke="#f87171" stroke-width="2"/>
      <rect x="-10" y="-34" width="8" height="8" fill="#f87171" opacity="0.7"/>
      <rect x="4" y="-34" width="8" height="8" fill="#f87171" opacity="0.7"/>
      <rect x="-10" y="-18" width="8" height="8" fill="#f87171" opacity="0.7"/>
      <rect x="4" y="-18" width="8" height="8" fill="#f87171" opacity="0.7"/>
      <rect x="-10" y="-2" width="8" height="8" fill="#f87171" opacity="0.7"/>
      <rect x="4" y="-2" width="8" height="8" fill="#f87171" opacity="0.7"/>
    </g>
    <text x="0" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5eead4">Merger</text>
  </g>

  <!-- receipt with changed merchant name -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" transform="translate(300,270)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#123832" stroke="#2dd4bf" stroke-width="2" opacity="0.9"/>
    <rect x="16" y="16" width="90" height="8" rx="2" fill="#5eead4" opacity="0.5"/>
    <rect x="16" y="34" width="118" height="6" rx="2" fill="#f87171" opacity="0.85"/>
    <rect x="16" y="48" width="70" height="6" rx="2" fill="#5eead4" opacity="0.4"/>
    <rect x="16" y="62" width="90" height="6" rx="2" fill="#5eead4" opacity="0.4"/>
    <text x="16" y="10" font-size="11" fill="#f87171">NEW MERCHANT</text>
  </g>
</svg>
