<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅用量额度到期清零封面图">
  <defs>
    <linearGradient id="bgCe" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141033"/>
      <stop offset="1" stop-color="#241a5c"/>
    </linearGradient>
    <radialGradient id="glowCe" cx="400" cy="180" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgCe)"/>
  <rect width="800" height="400" fill="url(#glowCe)"/>

  <text x="60" y="56" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#e0e7ff">用不完的额度</text>
  <text x="60" y="84" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#a5b4fc" opacity="0.9">token余量 · 生成次数 · 预付余额</text>

  <!-- large centered hourglass draining credits -->
  <g transform="translate(400,220)">
    <path d="M-70 -110 h140 M-70 110 h140" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M-70 -110 L70 -110 L10 0 L70 110 L-70 110 L-10 0 Z" fill="none" stroke="#818cf8" stroke-width="3.5"/>
    <clipPath id="topBulb"><path d="M-64 -104 L64 -104 L10 -4 L-10 -4 Z"/></clipPath>
    <g clip-path="url(#topBulb)">
      <rect x="-64" y="-104" width="128" height="34" fill="#c7d2fe"/>
    </g>
    <clipPath id="botBulb"><path d="M-10 4 L10 4 L64 104 L-64 104 Z"/></clipPath>
    <g clip-path="url(#botBulb)">
      <rect x="-64" y="72" width="128" height="32" fill="#4f46e5"/>
    </g>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fde68a" stroke-width="3"/>
    <text x="0" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#f87171">0</text>
    <text x="0" y="-130" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#c7d2fe" opacity="0.85">周期结束</text>
  </g>

  <g transform="translate(140,260)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="-16" y="-20" width="150" height="40" rx="20" fill="#241a5c" stroke="#f87171" stroke-width="2"/>
    <text x="59" y="6" text-anchor="middle" font-size="14" fill="#f87171" font-weight="700">不结转 · 不折现</text>
  </g>
  <text x="400" y="368" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a5b4fc" opacity="0.85">用量额度会随周期结束清零</text>
</svg>
