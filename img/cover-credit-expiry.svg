<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅用量额度到期清零封面图">
  <defs>
    <linearGradient id="bgGradCredit" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08201d"/>
      <stop offset="1" stop-color="#0e3a34"/>
    </linearGradient>
    <radialGradient id="glowCredit" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradCredit)"/>
  <rect width="800" height="400" fill="url(#glowCredit)"/>
  <g stroke="#1e5b50" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#5eead4" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">用不完的额度</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#2dd4bf">一到期就清零</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#5eead4"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5eead4" opacity="0.85">token余量 · 生成次数 · 预付余额</text>

  <!-- circular gauge dropping to zero -->
  <g transform="translate(600,150)">
    <circle r="72" fill="#123832" stroke="#1e5b50" stroke-width="14"/>
    <circle r="72" fill="none" stroke="#5eead4" stroke-width="14" stroke-dasharray="22 430" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#2dd4bf">0</text>
  </g>
  <g stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M600 232 v34" stroke-dasharray="4 4"/>
    <path d="M592 258 l8 10 l8 -10" fill="none"/>
  </g>
  <g transform="translate(600,300)">
    <rect x="-64" y="-24" width="128" height="48" rx="8" fill="#123832" stroke="#f87171" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#f87171" font-weight="700">已作废</text>
  </g>
  <text x="600" y="355" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5eead4" opacity="0.85">不结转 · 不折现</text>
</svg>
