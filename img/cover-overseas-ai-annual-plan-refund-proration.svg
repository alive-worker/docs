<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一张年历上剪刀裁掉后半段月份，旁边一个按比例退款的天平示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2a1c"/>
      <stop offset="100%" stop-color="#163825"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- calendar card -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="300" height="260" rx="14" fill="#f4ede0"/>
    <rect x="0" y="0" width="300" height="42" rx="14" fill="#c9a24a"/>
    <rect x="0" y="28" width="300" height="14" fill="#c9a24a"/>
    <circle cx="30" cy="0" r="9" fill="#8a6d2f"/>
    <circle cx="270" cy="0" r="9" fill="#8a6d2f"/>
    <text x="150" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2a1d0a" font-weight="700">ANNUAL PLAN</text>
    <!-- grid of 12 month cells -->
    <g font-family="Arial, sans-serif" font-size="13" fill="#3a2f1f">
      <!-- 6 used months, solid -->
      <g fill="#e4d4ad" stroke="#c9a24a" stroke-width="1.5">
        <rect x="18" y="60" width="66" height="46" rx="6"/>
        <rect x="94" y="60" width="66" height="46" rx="6"/>
        <rect x="170" y="60" width="66" height="46" rx="6"/>
        <rect x="18" y="114" width="66" height="46" rx="6"/>
        <rect x="94" y="114" width="66" height="46" rx="6"/>
        <rect x="170" y="114" width="66" height="46" rx="6"/>
      </g>
      <!-- 6 remaining months, dashed to be "cut" -->
      <g fill="none" stroke="#7a8f7a" stroke-width="2" stroke-dasharray="5 4">
        <rect x="18" y="168" width="66" height="46" rx="6"/>
        <rect x="94" y="168" width="66" height="46" rx="6"/>
        <rect x="170" y="168" width="66" height="46" rx="6"/>
      </g>
    </g>
    <text x="150" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b5a35">剩余月份仍待明确</text>
  </g>

  <!-- scissors cutting the calendar edge -->
  <g transform="translate(330,190) rotate(-18)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#e7c46a" stroke-width="5"/>
    <circle cx="0" cy="34" r="12" fill="none" stroke="#e7c46a" stroke-width="5"/>
    <path d="M10 8 L70 -14" stroke="#e7c46a" stroke-width="5" stroke-linecap="round"/>
    <path d="M10 26 L70 48" stroke="#e7c46a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <line x1="380" y1="200" x2="380" y2="330" stroke="#e7c46a" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- balance scale representing prorated refund -->
  <g transform="translate(520,90)">
    <line x1="90" y1="0" x2="90" y2="180" stroke="#dfe7dd" stroke-width="6" stroke-linecap="round"/>
    <rect x="60" y="176" width="60" height="14" rx="4" fill="#dfe7dd"/>
    <line x1="20" y1="40" x2="160" y2="40" stroke="#dfe7dd" stroke-width="5" stroke-linecap="round"/>
    <circle cx="90" cy="40" r="7" fill="#dfe7dd"/>
    <!-- left pan: full refund -->
    <line x1="20" y1="40" x2="20" y2="82" stroke="#dfe7dd" stroke-width="3"/>
    <path d="M-14 82 Q20 112 54 82 Z" fill="#4f8f6a" stroke="#dfe7dd" stroke-width="2"/>
    <!-- right pan: prorated (smaller, lower) -->
    <line x1="160" y1="40" x2="160" y2="104" stroke="#dfe7dd" stroke-width="3"/>
    <path d="M130 104 Q160 128 190 104 Z" fill="#c0563f" stroke="#dfe7dd" stroke-width="2"/>
    <text x="20" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfe7dd">冷静期</text>
    <text x="160" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfe7dd">按比例</text>
  </g>

  <text x="400" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f4ede0" font-weight="700">年付退款：冷静期 / 按比例 / 不退</text>
</svg>
