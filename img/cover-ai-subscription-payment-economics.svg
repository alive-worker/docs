<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI订阅支付经济学全景概览封面图">
  <defs>
    <linearGradient id="bgPE" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#0f2748"/>
    </linearGradient>
    <pattern id="gridPE" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bgPE)"/>
  <rect width="800" height="400" fill="url(#gridPE)"/>
  <rect x="0" y="0" width="800" height="84" fill="#132b4d"/>
  <rect x="0" y="80" width="800" height="4" fill="#3b82f6"/>
  <text x="40" y="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#eaf2ff">AI订阅支付经济学</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#93c5fd" opacity="0.9">账户 · 卡片 · 货币 · 退款 · 稳定币全景速览</text>

  <!-- 2x3 dashboard grid of mini stat cards -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(40,116)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="14" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <rect x="24" y="22" width="12" height="9" rx="2" fill="#60a5fa"/>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">账户体系</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">主账号/家庭组</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">如何搭建</text>
    </g>
    <g transform="translate(290,116)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="18" y="16" width="26" height="18" rx="3" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <line x1="18" y1="24" x2="44" y2="24" stroke="#60a5fa" stroke-width="2"/>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">卡片工具</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">虚拟卡/限额</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">如何选用</text>
    </g>
    <g transform="translate(540,116)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="30" y="30" font-size="20" fill="#60a5fa" font-weight="700" text-anchor="middle">¥$</text>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">货币汇率</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">动态转换损耗</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">如何避坑</text>
    </g>
    <g transform="translate(40,206)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M20 26 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <path d="M30 20 v12 M24 26 h12" stroke="#60a5fa" stroke-width="2"/>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">退款争议</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">拒付/申诉流程</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">如何维权</text>
    </g>
    <g transform="translate(290,206)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="30" cy="26" r="13" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <text x="30" y="31" font-size="13" fill="#60a5fa" text-anchor="middle" font-weight="700">₮</text>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">稳定币支付</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">链上结算通道</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">如何入门</text>
    </g>
    <g transform="translate(540,206)">
      <rect width="220" height="76" rx="10" fill="#132b4d" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M18 34 l10 -16 l8 10 l10 -18" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="24" font-size="13" fill="#eaf2ff" font-weight="700">全景速览</text>
      <text x="54" y="42" font-size="11" fill="#93c5fd" opacity="0.85">六大主题一次看懂</text>
      <text x="16" y="64" font-size="11" fill="#60a5fa">本文导航</text>
    </g>
  </g>
  <text x="400" y="368" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#93c5fd" opacity="0.85">一篇讲清 AI 订阅支付的全部关键环节</text>
</svg>
