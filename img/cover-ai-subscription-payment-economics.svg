<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 订阅支付经济学：账户结构、汇率与虚拟卡封面图">
  <defs>
    <linearGradient id="bgGradAspe" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#123a56"/>
    </linearGradient>
    <radialGradient id="glowAspe" cx="140" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradAspe)"/>
  <rect width="800" height="400" fill="url(#glowAspe)"/>
  <g stroke="#1e4f6b" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M40 320 h60 v30 h50"/>
    <path d="M60 360 h50 v-26 h40"/>
  </g>
  <g fill="#7dd3fc" opacity="0.7">
    <circle cx="40" cy="320" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="60" cy="360" r="3"/>
  </g>
  <text x="52" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#f0f9ff">订阅的钱</text>
  <text x="52" y="156" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#38bdf8">是怎么花没的</text>
  <rect x="52" y="170" width="120" height="4" rx="2" fill="#7dd3fc"/>
  <text x="52" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#7dd3fc" opacity="0.85">账户结构 · 汇率手续费 · 虚拟卡收拢</text>

  <!-- virtual card -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="180" height="112" rx="16" fill="#0f2c3d" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="18" y="24" width="40" height="26" rx="5" fill="#7dd3fc" opacity="0.85"/>
    <rect x="18" y="66" width="90" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="18" y="82" width="60" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
    <circle cx="148" cy="34" r="14" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <circle cx="160" cy="34" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- account nodes flowing into card -->
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.7">
    <path d="M330 260 C400 260 420 220 470 200"/>
    <path d="M330 300 C400 300 420 240 470 210"/>
    <path d="M330 340 C400 340 420 260 470 220"/>
  </g>
  <g>
    <circle cx="320" cy="260" r="20" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="320" cy="300" r="20" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="320" cy="340" r="20" fill="#0f2c3d" stroke="#7dd3fc" stroke-width="2"/>
  </g>
</svg>
