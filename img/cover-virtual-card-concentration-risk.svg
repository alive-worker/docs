<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一张虚拟卡绑定多个AI订阅，风控冻结导致集中度风险封面图">
  <defs>
    <linearGradient id="bgGrad26" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#301414"/>
      <stop offset="1" stop-color="#42201e"/>
    </linearGradient>
    <radialGradient id="glow26" cx="680" cy="70" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e07a5f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e07a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad26)"/>
  <rect width="800" height="400" fill="url(#glow26)"/>

  <!-- single card at left -->
  <rect x="56" y="150" width="150" height="96" rx="16" fill="#42201e" stroke="#f2b9a8" stroke-width="2.5"/>
  <rect x="70" y="176" width="60" height="10" rx="3" fill="#f2b9a8" opacity="0.8"/>
  <rect x="70" y="196" width="90" height="8" rx="3" fill="#f6d4c8" opacity="0.6"/>
  <circle cx="178" cy="176" r="10" fill="#e07a5f"/>
  <text x="56" y="140" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#f6d4c8">同一张虚拟卡</text>

  <!-- frozen mark on card -->
  <g stroke="#ff8a65" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="150" x2="182" y2="246"/>
  </g>
  <circle cx="196" cy="150" r="16" fill="#5c2420" stroke="#ff8a65" stroke-width="2"/>
  <text x="196" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffcdbf">✕</text>

  <!-- lines fanning out to three service nodes -->
  <g stroke="#f2b9a8" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.7">
    <line x1="206" y1="170" x2="470" y2="90"/>
    <line x1="206" y1="198" x2="470" y2="198"/>
    <line x1="206" y1="226" x2="470" y2="306"/>
  </g>

  <!-- three service cards, all showing failed state -->
  <g>
    <rect x="480" y="58" width="264" height="64" rx="12" fill="#3a1c1a" stroke="#7a3a34" stroke-width="1.3"/>
    <circle cx="506" cy="90" r="8" fill="#ff8a65"/>
    <text x="524" y="84" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fbe4dc">订阅 A 续费</text>
    <text x="524" y="104" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#ff8a65">同日失败</text>
  </g>
  <g>
    <rect x="480" y="166" width="264" height="64" rx="12" fill="#3a1c1a" stroke="#7a3a34" stroke-width="1.3"/>
    <circle cx="506" cy="198" r="8" fill="#ff8a65"/>
    <text x="524" y="192" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fbe4dc">订阅 B 续费</text>
    <text x="524" y="212" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#ff8a65">同日失败</text>
  </g>
  <g>
    <rect x="480" y="274" width="264" height="64" rx="12" fill="#3a1c1a" stroke="#7a3a34" stroke-width="1.3"/>
    <circle cx="506" cy="306" r="8" fill="#ff8a65"/>
    <text x="524" y="300" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fbe4dc">订阅 C 续费</text>
    <text x="524" y="320" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#ff8a65">同日失败</text>
  </g>

  <text x="56" y="300" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#fbe4dc">扣款集中度风险</text>
  <text x="58" y="330" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#f2b9a8">SINGLE CARD, SINGLE POINT OF FAILURE</text>
  <text x="736" y="374" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#f2b9a8" opacity="0.85">AI服务指南</text>
</svg>
