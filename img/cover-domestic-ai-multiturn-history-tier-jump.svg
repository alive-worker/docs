<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="过了分档线，整单按高档计，不是只加超出的一截">
  <rect width="800" height="400" fill="#101612"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700">过了线，整单都按高档</text>
  <text x="760" y="44" text-anchor="end" fill="#e0913f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700">AI服务指南</text>
  <rect x="40" y="88" width="720" height="196" rx="16" fill="#3a2a16"/>
  <line x1="40" y1="132" x2="760" y2="132" stroke="#f2d18a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="64" y="118" fill="#f2d18a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">档线以上</text>
  <text x="64" y="210" fill="#f4f0ea" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="40" font-weight="700">整单同一档</text>
  <text x="40" y="340" fill="#c4b59a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">不是只给超出的一截加价。历史还在 messages 里，短句改不了这一档。</text>
</svg>
