<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">AI Service Costs: Pay Attention to Accepted Results</title><desc id="desc">AI service costs: requests, review and rework divided by accepted results</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d28"/><stop offset="1" stop-color="#071b24"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/><circle cx="746" cy="55" r="180" fill="#2a6353" opacity=".22"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="44" y="48" font-size="14" fill="#9bd5bd" letter-spacing="3">AI SERVICE ECONOMICS / 2026</text>
  <text x="44" y="108" font-size="34" fill="#f5f4ea" font-weight="700">What does a usable result cost?</text>
  <text x="44" y="146" font-size="18" fill="#b8ceca">Count the work behind the answer.</text>
  <rect x="44" y="188" width="224" height="82" rx="12" fill="#173b3b" stroke="#487262"/><text x="66" y="220" font-size="12" fill="#8ccbb2">01</text><text x="66" y="249" font-size="23" fill="#fff">Requests</text><rect x="288" y="188" width="224" height="82" rx="12" fill="#173b3b" stroke="#487262"/><text x="310" y="220" font-size="12" fill="#8ccbb2">02</text><text x="310" y="249" font-size="23" fill="#fff">Review</text><rect x="532" y="188" width="224" height="82" rx="12" fill="#173b3b" stroke="#487262"/><text x="554" y="220" font-size="12" fill="#8ccbb2">03</text><text x="554" y="249" font-size="23" fill="#fff">Rework</text>
  <path d="M44 294h712" stroke="#4d756b"/><text x="44" y="338" font-size="22" fill="#f5d28b">Total cost ÷ Accepted results</text><text x="44" y="375" font-size="13" fill="#9ab9b2">QUALITY FIRST. THEN COMPARE COST.</text></g></svg>