<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="After Bailian free tokens end, unverified accounts stop; verified accounts default to pay-as-you-go">
  <rect width="800" height="400" fill="#14110e"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f4f0ea">Quota hits zero. Then the bill forks.</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#cbbfa8">AI Access Guide</text>
  <circle cx="150" cy="220" r="100" fill="none" stroke="#3a3228" stroke-width="16"/>
  <path d="M150 120 A100 100 0 0 1 236 172" fill="none" stroke="#e2b15a" stroke-width="16" stroke-linecap="round"/>
  <text x="150" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f2d18a">0</text>
  <text x="150" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#d9c39a">free tokens</text>
  <path d="M264 220 H330" fill="none" stroke="#cbbfa8" stroke-width="2.5"/>
  <polygon points="330,220 318,214 318,226" fill="#cbbfa8"/>
  <rect x="360" y="120" width="400" height="64" rx="10" fill="#2a2214" stroke="#e2b15a" stroke-width="2"/>
  <text x="380" y="148" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">Unverified</text>
  <text x="380" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#d9c39a">Calls stop when the quota ends</text>
  <rect x="360" y="214" width="400" height="64" rx="10" fill="#173a2c" stroke="#7be8b8" stroke-width="2"/>
  <text x="380" y="242" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">Verified</text>
  <text x="380" y="266" font-family="Segoe UI, sans-serif" font-size="15" fill="#cfe8dc">Default continues, billed from balance</text>
  <text x="360" y="328" font-family="Segoe UI, sans-serif" font-size="15" fill="#cbbfa8">Verification opens pay-as-you-go, not more free tokens.</text>
</svg>