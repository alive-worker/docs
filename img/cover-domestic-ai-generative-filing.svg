<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="国内大模型API接入产品需要单独完成生成式AI服务备案示意图">
  <defs>
    <linearGradient id="bgGradGf" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14201d"/>
      <stop offset="1" stop-color="#1a2a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradGf)"/>

  <!-- three folders representing three different filings -->
  <g transform="translate(150,150)">
    <path d="M-70 -30 L-30 -30 L-18 -14 L70 -14 L70 60 L-70 60 Z" fill="#20342f" stroke="#4fae8a" stroke-width="2.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#9fe6c4">ICP备案</text>
  </g>
  <g transform="translate(340,150)">
    <path d="M-70 -30 L-30 -30 L-18 -14 L70 -14 L70 60 L-70 60 Z" fill="#20342f" stroke="#f2b84a" stroke-width="2.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#f2d18a">算法推荐备案</text>
  </g>
  <g transform="translate(540,150)">
    <path d="M-80 -34 L-36 -34 L-22 -16 L80 -16 L80 66 L-80 66 Z" fill="#2a2038" stroke="#c98be0" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#e6c4f7">生成式AI</text>
    <text x="0" y="30" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#e6c4f7">服务备案</text>
  </g>

  <!-- checkmarks on first two, question/exclaim highlight on third -->
  <g transform="translate(150,110)">
    <circle r="14" fill="#2f5e4c"/>
    <path d="M-6 0 L-1 6 L8 -8" fill="none" stroke="#7be8b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(340,110)">
    <circle r="14" fill="#5e4f2f"/>
    <path d="M-6 0 L-1 6 L8 -8" fill="none" stroke="#f7d98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(540,102)">
    <circle r="17" fill="#4a2f5e"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="800" fill="#f2b84a">!</text>
  </g>

  <!-- abstract stamp/seal shape near the third folder, generic circular stamp, no national emblem -->
  <g transform="translate(600,230)" opacity="0.9">
    <circle r="34" fill="none" stroke="#c98be0" stroke-width="3"/>
    <circle r="26" fill="none" stroke="#c98be0" stroke-width="1.6" stroke-dasharray="3 4"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#e6c4f7">备案</text>
  </g>

  <!-- connecting line showing "API access ≠ vendor filed for you" -->
  <g stroke="#4fae8a" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.6">
    <path d="M120 190 C 200 260 400 260 500 220"/>
  </g>
  <text x="60" y="60" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#8fd6b6">调用厂商API ≠ 厂商已代为备案</text>

  <text x="60" y="330" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#eef2fb">三种备案 · 别只做对一件事</text>
  <text x="62" y="360" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" letter-spacing="1" fill="#b6d6c8">GENERATIVE AI SERVICE FILING VS ICP</text>
  <text x="736" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI服务指南</text>
</svg>
