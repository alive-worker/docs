<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free-tier AI usage getting throttled unexpectedly">
  <defs>
    <linearGradient id="bgFte" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062226"/>
      <stop offset="1" stop-color="#0a3a40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgFte)"/>

  <g transform="translate(400,190)">
    <path d="M-140 20 A140 140 0 0 1 140 20" fill="none" stroke="#0e4b52" stroke-width="22"/>
    <path d="M-140 20 A140 140 0 0 1 -40 -128" fill="none" stroke="#22d3ee" stroke-width="22"/>
    <path d="M-40 -128 A140 140 0 0 1 60 -122" fill="none" stroke="#fbbf24" stroke-width="22"/>
    <path d="M60 -122 A140 140 0 0 1 140 20" fill="none" stroke="#f87171" stroke-width="22"/>
    <g transform="rotate(70)">
      <line x1="0" y1="0" x2="0" y2="-118" stroke="#ecfeff" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="12" fill="#ecfeff"/>
    <text x="0" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#67e8f9">Current rate</text>
  </g>

  <text x="60" y="68" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#ecfeff">Your Free Tier Just Slowed Down</text>
  <text x="60" y="98" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#67e8f9" opacity="0.9">Rate limits · hidden thresholds · peak-hour throttling</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <text x="80" y="330" font-size="14" fill="#f87171" font-weight="700">Throttled</text>
    <text x="720" y="330" text-anchor="end" font-size="14" fill="#22d3ee" font-weight="700">Normal rate</text>
  </g>
  <text x="400" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#67e8f9" opacity="0.85">"Free" often hides an invisible usage ceiling</text>
</svg>
