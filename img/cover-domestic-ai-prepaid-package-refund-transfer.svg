<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="预付费资源包用不完，退款与跨账号转让两条路径由合同条款决定示意图">
  <defs>
    <linearGradient id="bgGradPrepaid" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14201d"/>
      <stop offset="1" stop-color="#1a2a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradPrepaid)"/>

  <text x="60" y="60" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#eef2fb">资源包用不完怎么办？</text>

  <!-- prepaid package box -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="220" height="110" rx="10" fill="#20342f" stroke="#4fae8a" stroke-width="3"/>
    <text x="110" y="34" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#8fd6b6">预付费资源包</text>
    <text x="110" y="58" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b6d6c8" opacity="0.85">已购买 · 已确认收入</text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#7be8b8" opacity="0.9">剩余未用</text>
    <rect x="20" y="90" width="180" height="10" rx="5" fill="#0f241c"/>
    <rect x="20" y="90" width="70" height="10" rx="5" fill="#7be8b8"/>
  </g>

  <!-- two arrows pointing down to two outcome boxes -->
  <path d="M170 224 L110 262" stroke="#f2d18a" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.85"/>
  <path d="M170 224 L520 262" stroke="#c98be0" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.85"/>

  <!-- outcome 1: refund -->
  <g transform="translate(30,272)">
    <rect x="0" y="0" width="200" height="78" rx="10" fill="#3a2a17" stroke="#f2d18a" stroke-width="2.5"/>
    <text x="100" y="30" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#f2d18a">退款？</text>
    <text x="100" y="54" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e0c48a" opacity="0.9">看厂商协议条款</text>
  </g>

  <!-- outcome 2: transfer between accounts -->
  <g transform="translate(430,272)">
    <rect x="0" y="0" width="200" height="78" rx="10" fill="#2a2038" stroke="#c98be0" stroke-width="2.5"/>
    <text x="100" y="30" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#e6c4f7">转关联账号？</text>
    <text x="100" y="54" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#d9b8ec" opacity="0.9">看厂商是否支持</text>
  </g>

  <!-- contract icon on the right, near the package -->
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#20242f" stroke="#8fa6d6" stroke-width="2.5"/>
    <line x1="24" y1="34" x2="126" y2="34" stroke="#b9c8ec" stroke-width="3"/>
    <line x1="24" y1="58" x2="126" y2="58" stroke="#8fa6d6" stroke-width="3" opacity="0.75"/>
    <line x1="24" y1="82" x2="106" y2="82" stroke="#8fa6d6" stroke-width="3" opacity="0.75"/>
    <line x1="24" y1="106" x2="120" y2="106" stroke="#8fa6d6" stroke-width="3" opacity="0.6"/>
    <circle cx="112" cy="128" r="14" fill="none" stroke="#f2d18a" stroke-width="3"/>
    <path d="M105 128 l5 5 l10 -12" stroke="#f2d18a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="635" y="266" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#b9c8ec" opacity="0.9">采购合同</text>
  <text x="635" y="286" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8fa6d6" opacity="0.85">采购前问清楚</text>

  <text x="60" y="368" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b6d6c8" opacity="0.85">具体退款与转让规则以各厂商服务协议为准，无行业统一标准</text>
  <text x="736" y="34" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#b6d6c8" opacity="0.85">AI服务指南</text>
</svg>
