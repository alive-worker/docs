<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163825"/>
      <stop offset="100%" stop-color="#0d2318"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- calendar left: authorization date -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="160" height="160" rx="14" fill="#1f4a33" stroke="#e8c96b" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="14" fill="#e8c96b"/>
    <rect x="0" y="26" width="160" height="14" fill="#e8c96b"/>
    <text x="80" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#163825">AUTH</text>
    <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#f4ede1">16</text>
    <text x="80" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c9d8cd">est. rate</text>
  </g>

  <!-- calendar right: settlement date -->
  <g transform="translate(520,120)">
    <rect x="0" y="0" width="160" height="160" rx="14" fill="#1f4a33" stroke="#7fb99a" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="14" fill="#7fb99a"/>
    <rect x="0" y="26" width="160" height="14" fill="#7fb99a"/>
    <text x="80" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d2318">SETTLE</text>
    <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#f4ede1">18</text>
    <text x="80" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c9d8cd">real rate</text>
  </g>

  <!-- arrow between -->
  <g stroke="#f4ede1" stroke-width="3" fill="none">
    <line x1="292" y1="200" x2="508" y2="200"/>
    <polygon points="508,200 494,192 494,208" fill="#f4ede1"/>
  </g>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e8c96b">1–3 days</text>

  <!-- FX ticker line -->
  <g transform="translate(120,300)" stroke="#7fb99a" stroke-width="3" fill="none">
    <polyline points="0,20 40,5 80,30 120,10 160,25 200,0 240,18 280,8 320,22 360,4 400,15 440,2 480,20 520,6 560,16"/>
  </g>

  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#f4ede1">Which Day Sets the Rate?</text>
</svg>
