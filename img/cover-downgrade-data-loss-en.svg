<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI subscription downgrade to free plan data retention cover image">
  <defs>
    <linearGradient id="bgGradDdlEn" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031a2e"/>
      <stop offset="1" stop-color="#063354"/>
    </linearGradient>
    <pattern id="hatchDdlEn" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#0c4570" stroke-width="2" opacity="0.5"/>
