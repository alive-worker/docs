<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Why ChatGPT Charges but Claude API Declines</title>
  <desc id="desc">One virtual card splits into a subscription rail that posts and an API-credit rail that declines</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#2a1a08"/><stop offset="1" stop-color="#0f1c24"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="720" cy="70" r="170" fill="#c48a2a" opacity=".18"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="44" y="48" font-size="14" fill="#f0c57a" letter-spacing="3">BILLING RAILS / 2026</text>
    <text x="44" y="108" font-size="32" fill="#f5f4ea" font-weight="700">One card, two acquirers</text>
    <text x="44" y="146" font-size="18" fill="#d5c4a1">A Plus charge does not prove API credits will clear.</text>
    <rect x="44" y="188" width="340" height="90" rx="12" fill="#2b2212" stroke="#c49a48"/>
    <text x="66" y="222" font-size="12" fill="#f0c57a">01 SUBSCRIPTION</text>
    <text x="66" y="254" font-size="22" fill="#fff">ChatGPT Plus · MIT</text>
    <rect x="416" y="188" width="340" height="90" rx="12" fill="#2b2212" stroke="#8a5a32"/>
    <text x="438" y="222" font-size="12" fill="#e8b48a">02 API CREDITS</text>
    <text x="438" y="254" font-size="22" fill="#fff">Prepaid top-up · decline</text>
    <path d="M44 304h712" stroke="#8a6a3a"/>
    <text x="44" y="342" font-size="22" fill="#f5d28b">Split the bills before swapping cards</text>
    <text x="44" y="375" font-size="13" fill="#c4b496">Prepaid BINs, 3DS and billing country can split one card into two outcomes.</text>
  </g>
</svg>
