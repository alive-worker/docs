<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three correct steps before filing a chargeback cover image">
  <defs>
    <linearGradient id="bgGradCbEn" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#052018"/>
      <stop offset="1" stop-color="#0a3d2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradCbEn)"/>

  <text x="52" y="70" font-family="sans-serif" font-size="27" font-weight="700" fill="#6ee7b7">Before You File a Chargeback</text>
  <text x="52" y="106" font-family="sans-serif" font-size="24" font-weight="700" fill="#34d399">Do These Three Steps in Order</text>

  <rect x="640" y="40" width="120" height="34" rx="6" fill="#0a3d2c" stroke="#34d399" stroke-width="2"/>
  <text x="700" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Right Order</text>

  <line x1="120" y1="260" x2="680" y2="260" stroke="#0f5c40" stroke-width="4"/>

  <g transform="translate(160,260)">
    <circle r="34" fill="#0a3d2c" stroke="#34d399" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#6ee7b7">1</text>
    <text y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Contact the merchant</text>
    <text y="84" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#6ee7b7">Ask for refund or reason</text>
  </g>

  <g transform="translate(400,260)">
    <circle r="34" fill="#0a3d2c" stroke="#34d399" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#6ee7b7">2</text>
    <text y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Keep the evidence</text>
    <text y="84" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#6ee7b7">Screenshots, emails, ticket #</text>
  </g>

  <g transform="translate(640,260)">
    <circle r="34" fill="#0a3d2c" stroke="#f59e0b" stroke-width="3.5"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#fcd34d">3</text>
    <text y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fde68a">Then file with your bank</text>
    <text y="84" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#fcd34d">Last resort</text>
  </g>

  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#34d399" opacity="0.85">Skipping steps can look like friendly fraud and hurt your account standing</text>
</svg>
