<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="提示缓存命中按折扣计，写入按1.25倍或2倍计">
  <rect width="800" height="400" fill="#10140f"/>
  <text x="40" y="52" fill="#f4f0ea" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">第一笔是写入，后面才是命中</text>
  <text x="760" y="44" text-anchor="end" fill="#b7c9a4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI服务指南</text>
  <polyline points="80,110 240,110 240,250 720,250" fill="none" stroke="#e2b15a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="240" cy="110" r="8" fill="#f2d18a"/>
  <text x="80" y="96" fill="#f2d18a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">写入 1.25 倍或 2 倍</text>
  <text x="420" y="236" fill="#8fd6b6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">命中约 0.1 倍</text>
  <text x="40" y="352" fill="#c5d4b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">断点放在会变的内容上，等于每次都付写入。</text>
</svg>
