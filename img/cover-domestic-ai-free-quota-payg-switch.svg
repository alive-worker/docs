<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="百炼免费额度用尽后，未实名停调用、已实名默认转按量">
  <rect width="800" height="400" fill="#14110e"/>
  <text x="40" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#f4f0ea">额度归零之后，账单才分叉</text>
  <text x="760" y="40" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#cbbfa8">AI服务指南</text>
  <circle cx="168" cy="220" r="108" fill="none" stroke="#3a3228" stroke-width="16"/>
  <path d="M168 112 A108 108 0 0 1 262 168" fill="none" stroke="#e2b15a" stroke-width="16" stroke-linecap="round"/>
  <text x="168" y="214" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#f2d18a">0</text>
  <text x="168" y="248" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#d9c39a">免费额度</text>
  <path d="M290 220 H360" fill="none" stroke="#cbbfa8" stroke-width="2.5"/>
  <polygon points="360,220 348,214 348,226" fill="#cbbfa8"/>
  <rect x="390" y="120" width="360" height="64" rx="10" fill="#2a2214" stroke="#e2b15a" stroke-width="2"/>
  <text x="410" y="148" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#f2d18a">未实名</text>
  <text x="410" y="172" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#d9c39a">用完即停，调用被掐断</text>
  <rect x="390" y="214" width="360" height="64" rx="10" fill="#173a2c" stroke="#7be8b8" stroke-width="2"/>
  <text x="410" y="242" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#8fd6b6">已实名</text>
  <text x="410" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#cfe8dc">默认继续，按余额扣</text>
  <text x="390" y="328" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#cbbfa8">实名打开的是按量，不是更长的免费。</text>
</svg>