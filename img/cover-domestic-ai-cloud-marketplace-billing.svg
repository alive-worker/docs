<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2a1d"/>
      <stop offset="1" stop-color="#163825"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- top: model vendor -->
  <rect x="330" y="34" width="140" height="46" rx="10" fill="#f4efe4" opacity="0.95"/>
  <text x="400" y="63" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#163825" font-weight="700">DeepSeek</text>

  <!-- branching lines from vendor to two cloud resellers -->
  <path d="M370 80 C 330 130, 240 130, 210 168" stroke="#d7b56d" stroke-width="3" fill="none"/>
  <path d="M430 80 C 470 130, 560 130, 590 168" stroke="#d7b56d" stroke-width="3" fill="none"/>

  <!-- left reseller: Aliyun-style node -->
  <rect x="120" y="168" width="180" height="60" rx="12" fill="#1f4a34" stroke="#7fbf9b" stroke-width="2"/>
  <text x="210" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#eaf3ec" font-weight="600">Cloud Marketplace A</text>
  <text x="210" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a9c9b6">resale · invoice · SLA</text>

  <!-- right reseller: Tencent-style node -->
  <rect x="500" y="168" width="180" height="60" rx="12" fill="#1f4a34" stroke="#7fbf9b" stroke-width="2"/>
  <text x="590" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#eaf3ec" font-weight="600">Cloud Marketplace B</text>
  <text x="590" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a9c9b6">resale · invoice · SLA</text>

  <!-- two parallel support channels going down to enterprise buyer -->
  <path d="M210 228 L 210 290" stroke="#e5c25c" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M590 228 L 590 290" stroke="#e5c25c" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="210" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e5c25c">ticket</text>
  <text x="590" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e5c25c">ticket</text>

  <!-- enterprise buyer at bottom -->
  <rect x="290" y="290" width="220" height="66" rx="12" fill="#f4efe4"/>
  <text x="400" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#163825" font-weight="700">Enterprise Buyer</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4d6a58">billing entity? support? SLA?</text>
  <path d="M290 305 L 210 260" stroke="#e5c25c" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M510 305 L 590 260" stroke="#e5c25c" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- decorative small dots -->
  <circle cx="60" cy="60" r="3" fill="#7fbf9b" opacity="0.5"/>
  <circle cx="740" cy="60" r="3" fill="#7fbf9b" opacity="0.5"/>
  <circle cx="60" cy="340" r="3" fill="#7fbf9b" opacity="0.5"/>
  <circle cx="740" cy="340" r="3" fill="#7fbf9b" opacity="0.5"/>
</svg>
